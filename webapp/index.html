<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yaqin Food — HoReCa &amp; Distribution</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚚</text></svg>">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --surface:#FFFFFF; --ink:#101211; --muted:#6B6E6A;
    --accent:#FF5103; --accent-deep:#D8440A; --transit:#3F7D58;
    --danger:#B3472B; --border:#E7E5DE; --radius:14px; --pill:#F0EFE9; --field-bg:#F7F6F1;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14130F; --surface:#1E1C17; --ink:#F5F3EC; --muted:#A7A399;
      --border:#332F27; --pill:#2A2820; --field-bg:#221F19;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14130F; --surface:#1E1C17; --ink:#F5F3EC; --muted:#A7A399;
    --border:#332F27; --pill:#2A2820; --field-bg:#221F19;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
  *{box-sizing:border-box;}
  body{
    margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.num{font-family:'Barlow Condensed',Impact,sans-serif; font-weight:700;}
  .app{max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; background:var(--bg);}
  .topbar{
    position:sticky; top:0; z-index:10; padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px;
    background:var(--bg); color:var(--ink); display:flex; align-items:center; justify-content:space-between;
    gap:8px; border-bottom:1px solid var(--border);
  }
  .topbar-left{display:flex; align-items:center; gap:11px; min-width:0;}
  .topbar .logo{width:52px;height:52px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;cursor:pointer;}
  .topbar .logo:active{transform:scale(.94);}
  .topbar .logo img{width:100%;height:100%;object-fit:contain;padding:4px;}
  .topbar .brand{font-size:20px; line-height:1.1; letter-spacing:.2px;}
  .topbar .tagline{font-family:'Inter'; font-size:11px; color:var(--muted); font-weight:500; margin-top:1px;}
  .topbar-icons{display:flex; align-items:center; gap:1px; flex:none;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--ink);position:relative;padding:9px;line-height:1;border-radius:10px;display:flex;}
  .icon-btn:active{background:var(--surface);}
  .fav-badge, .cart-badge-top{
    position:absolute; top:3px; right:3px; background:var(--accent-deep); color:#fff; font-size:9px; font-weight:700;
    border-radius:8px; min-width:14px; height:14px; display:flex; align-items:center; justify-content:center; padding:0 3px;
  }
  .content{flex:1; padding:16px 16px 96px; overflow-x:hidden;}
  .search{
    width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font-size:14px; margin-bottom:14px;
  }
  .grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:11px;}
  .tile{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    overflow:hidden; cursor:pointer; display:flex; flex-direction:column; text-align:center;
    box-shadow:0 2px 0 rgba(0,0,0,.04), 0 6px 14px rgba(16,18,17,.06);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .tile:active{ transform:scale(.96); box-shadow:0 1px 0 rgba(0,0,0,.04), 0 2px 6px rgba(16,18,17,.06); }
  .tile-icon{width:100%; aspect-ratio:1; background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:34px; flex:none;}
  .tile-icon img{width:100% !important; height:100% !important; object-fit:cover; border-radius:0 !important;}
  .tile-title{font-size:12.5px; font-weight:600; line-height:1.25; padding:10px 8px 14px;}
  .section-label{font-size:13px; color:var(--muted); font-weight:600; margin:18px 0 10px;}
  .detail-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .back{border:none; background:var(--surface); border:1px solid var(--border); width:36px;height:36px;border-radius:10px; color:var(--ink); cursor:pointer; display:flex;align-items:center;justify-content:center; flex:none;}
  .detail-head h2{margin:0; font-size:19px; line-height:1.2;}
  .prod-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .prod-tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px; display:flex; flex-direction:column; gap:8px; position:relative;}
  .prod-tile.out-of-stock{opacity:.55;}
  .prod-photo{width:100%; aspect-ratio:1; border-radius:12px; background:var(--bg); display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:36px; position:relative;}
  .prod-photo img{width:100% !important;height:100% !important;object-fit:cover;border-radius:0 !important;}
  .prod-name{font-size:12.5px; font-weight:500; line-height:1.3; color:var(--muted);}
  .prod-price{font-size:16.5px; font-weight:800; color:var(--ink); letter-spacing:-.2px;}
  .prod-price .prod-unit{font-size:11.5px; font-weight:500; color:var(--muted); margin-left:3px;}
  .discount-badge{display:inline-flex; align-items:center; gap:1px; color:var(--danger); font-size:11.5px; font-weight:700; vertical-align:middle;}
  .discount-badge svg{width:10px;height:10px;}
  .discount-tag{position:absolute; top:8px; left:8px; display:inline-flex; align-items:center; gap:2px; background:var(--danger); color:#fff; font-size:10.5px; font-weight:700; padding:3px 7px; border-radius:20px; z-index:1;}
  .discount-tag svg{width:11px;height:11px;}
  .old-price{font-size:12px; color:var(--muted); text-decoration:line-through; font-weight:500; margin-left:4px;}
  .oos-label{font-size:11.5px; font-weight:700; color:var(--danger);}
  .btn-add-tile{border:none; background:var(--pill); color:var(--ink); font-size:12.5px; font-weight:700; padding:9px; border-radius:999px; cursor:pointer; width:100%;}
  .tile-qty{display:flex; align-items:center; justify-content:space-between; background:var(--pill); border:none; border-radius:999px; padding:4px 6px;}
  .tile-qty button{width:26px;height:26px;border-radius:50%;border:none;background:var(--surface);color:var(--ink);font-size:16px;cursor:pointer;}
  .tile-qty span{font-weight:700; font-size:14px;}
  input.qty-input{width:44px; border:none; background:transparent; text-align:center; font-weight:700; font-size:14px; color:var(--ink); padding:0; font-family:'Inter'; -moz-appearance:textfield;}
  input.qty-input::-webkit-outer-spin-button, input.qty-input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  input.qty-input:focus{outline:none;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; font-weight:600; margin-bottom:5px; color:var(--muted);}
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--field-bg); color:var(--ink); font-size:14.5px; font-family:'Inter';
  }
  .field textarea{ resize:none; min-height:100px; }
  .price-box{
    background:var(--bg); border:1px dashed var(--border); border-radius:10px; padding:12px 14px;
    display:flex; justify-content:space-between; align-items:center; margin:16px 0;
  }
  .price-box .num{font-size:22px; color:var(--accent-deep);}
  .btn{width:100%; padding:13px; border-radius:10px; border:none; font-size:15px; font-weight:600; cursor:pointer; font-family:'Inter';}
  .btn-primary{background:var(--accent); color:#fff; box-shadow:0 3px 10px rgba(255,81,3,.28);}
  .btn-primary:active{background:var(--accent-deep);}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--muted); border:1px solid var(--border);}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn-small{width:auto; padding:8px 12px; font-size:12.5px; border-radius:8px;}
  .item-row{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--border);}
  .item-row:last-child{border-bottom:none;}
  .item-name{font-size:14px; font-weight:500;}
  .item-price{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .qty{display:flex; align-items:center; gap:10px; width:fit-content; border:1px solid var(--ink); border-radius:10px; padding:3px 4px;}
  .qty button{width:28px; height:28px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:16px; cursor:pointer;}
  .qty span{min-width:16px; text-align:center; font-size:14px; font-weight:600;}
  .cart-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;}
  .cart-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
  .cart-card-photo{width:78px; height:78px; border-radius:14px; background:var(--bg); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; overflow:hidden; flex:none; font-size:30px;}
  .cart-card-photo img{width:100% !important; height:100% !important; object-fit:cover; border-radius:0 !important;}
  .cart-card-title{font-weight:600; font-size:14.5px;}
  .cart-card-meta{font-size:12px; color:var(--muted); margin-top:4px;}
  .cart-card-price{font-weight:700; font-size:15px; white-space:nowrap;}
  .remove{border:none; background:none; color:var(--danger); font-size:12.5px; cursor:pointer; padding:8px 0 0; text-align:right; width:100%;}
  .total-bar{position:sticky; bottom:calc(72px + env(safe-area-inset-bottom,0px)); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-top:8px; display:flex; flex-direction:column; gap:10px;}
  .total-row{display:flex; justify-content:space-between; font-size:15px; font-weight:600;}
  .empty{text-align:center; color:var(--muted); padding:60px 20px; font-size:14px;}
  .empty .e-icon{font-size:36px; display:block; margin-bottom:10px;}
  .empty-cart{text-align:center; padding:64px 24px 30px;}
  .empty-cart .ec-icon{width:84px; height:84px; border-radius:22px; background:var(--pill); color:var(--accent); display:flex; align-items:center; justify-content:center; margin:0 auto 18px;}
  .empty-cart .ec-icon svg{width:38px; height:38px;}
  .empty-cart h3{font-size:18px; margin:0 0 8px;}
  .empty-cart p{font-size:13.5px; color:var(--muted); margin:0 0 24px; line-height:1.45;}
  .empty-cart .ec-btn{width:auto; padding:13px 30px; border-radius:999px; display:inline-block;}
  .checkout-details{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-top:14px;}
  .date-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px;}
  .date-pill{flex:none; border:1px solid var(--border); background:var(--field-bg); color:var(--ink); font-size:12.5px; font-weight:600; padding:9px 13px; border-radius:12px; cursor:pointer; font-family:'Inter';}
  .date-pill.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .time-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .time-slot{border:1px solid var(--border); background:var(--field-bg); color:var(--ink); font-size:13px; font-weight:600; padding:9px 0; border-radius:10px; cursor:pointer; font-family:'Inter';}
  .time-slot.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .order-item-photo{width:44px; height:44px; border-radius:10px; background:var(--bg); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; overflow:hidden; flex:none; font-size:18px;}
  .order-item-photo img{width:100% !important; height:100% !important; object-fit:cover; border-radius:0 !important;}
  .delivered-box{display:flex; align-items:center; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border);}
  .delivered-label{font-size:12px; color:var(--muted); flex:1;}
  .delivered-box input.qty-input{width:56px; border:1px solid var(--ink); border-radius:8px; padding:6px 4px;}
  .delivered-unit{font-size:12px; color:var(--muted);}
  .order-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px; cursor:pointer;}
  .order-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .order-id{font-weight:700; font-size:15px;}
  .status{font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; white-space:nowrap;}
  .status-new{background:#FDEBD0; color:var(--accent-deep);}
  .status-processing{background:#E4ECE6; color:var(--transit);}
  .status-done{background:#DFF3E4; color:#2E7D46;}
  .status-cancelled{background:#F6DEDA; color:var(--danger);}
  .order-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 12px;}
  .order-row .k{display:block; font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.3px;}
  .order-row .v{display:block; font-size:13.5px; font-weight:600; margin-top:2px;}
  .order-open{margin-top:10px; font-size:12.5px; font-weight:700; color:var(--accent-deep);}
  .order-detail-head{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
  .order-total-big{font-size:26px; font-weight:800; margin-bottom:14px; letter-spacing:-.3px;}
  .order-total-big span{font-size:15px; font-weight:600; color:var(--muted); margin-left:2px;}
  .order-detail-actions{display:flex; gap:8px; margin-top:14px;}
  .order-item-row{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:8px;}
  .item-status-top{display:flex; justify-content:flex-end; margin-bottom:8px;}
  .order-item-top{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .item-status{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px;}
  .item-status-pending{background:#F0EEE7; color:var(--muted);}
  .item-status-accepted{background:#DFF3E4; color:#2E7D46;}
  .item-status-rejected{background:#F6DEDA; color:var(--danger);}
  .admin-item-actions{display:flex; gap:8px; margin-top:8px;}
  .reason-box{margin-top:8px; display:flex; gap:6px;}
  .reason-box input{flex:1;}
  .template-card, .admin-list-item{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;}
  .template-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .template-title{font-weight:600; font-size:14.5px;}
  .template-use{border:none; background:var(--ink); color:#fff; font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:8px; cursor:pointer;}
  .bottomnav{position:sticky; bottom:0; z-index:10; display:flex; background:var(--surface); border-top:1px solid var(--border); padding:10px 6px calc(10px + env(safe-area-inset-bottom,0px));}
  .navbtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; color:var(--muted); font-family:'Inter'; font-size:10.5px; cursor:pointer; position:relative; padding:5px 0; border-radius:12px;}
  .navbtn svg{width:24px; height:24px;}
  .navbtn.active{color:var(--accent-deep); font-weight:700; background:rgba(255,81,3,0.08);}
  .badge{position:absolute; top:-3px; right:22%; background:var(--accent-deep); color:#fff; font-size:10px; font-weight:700; border-radius:10px; min-width:17px; height:17px; display:flex; align-items:center; justify-content:center; padding:0 4px;}
  .profile-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
  .profile-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:14px;}
  .profile-row:last-child{border-bottom:none;}
  .profile-row .k{color:var(--muted);}
  .profile-row .v{font-weight:600;}
  .stat-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .stat-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px;}
  .stat-label{font-size:11.5px; color:var(--muted);}
  .stat-value{font-size:20px; font-weight:700; margin-top:4px;}
  .menu-list{display:flex; flex-direction:column; gap:8px;}
  .menu-item{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px 14px; font-size:14px; font-weight:600; cursor:pointer;}
  .menu-item svg{flex:none;}
  .access-screen, .loading-screen{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:70vh; text-align:center; padding:30px;}
  .loading-spinner{width:42px; height:42px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--accent); animation:spin .8s linear infinite; margin-bottom:16px;}
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .access-screen .e{font-size:44px; margin-bottom:14px;}
  .access-screen p{color:var(--muted); font-size:14px; line-height:1.5; max-width:280px;}
  .icon-upload-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .icon-preview{width:52px;height:52px;border-radius:10px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:22px;flex:none;}
  .icon-preview img{width:100%;height:100%;object-fit:cover;}
  .upload-btn{border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:12.5px; font-weight:600; padding:9px 12px; border-radius:9px; cursor:pointer; display:flex; align-items:center; gap:6px;}
  .reorder-btns{display:flex; flex-direction:column; gap:2px;}
  .reorder-btn{width:22px; height:18px; border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:5px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;}
  .reorder-btn.reorder-up{transform:rotate(180deg);}
  .reorder-btn:disabled{opacity:.3; cursor:default;}
  .row-between{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .muted-small{font-size:11.5px; color:var(--muted); line-height:1.4; margin:4px 0 14px;}
  .divider{height:1px; background:var(--border); margin:16px 0;}
  .checkbox-row{display:flex; align-items:center; gap:8px; font-size:13.5px; margin-bottom:12px;}
  .checkbox-row input{width:auto;}
  .fav-heart{
    position:absolute; top:8px; right:8px; width:30px; height:30px; border-radius:50%;
    background:rgba(255,255,255,.92); border:none; display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--muted); box-shadow:0 2px 6px rgba(16,18,17,.15); padding:0;
  }
  .fav-heart.active{color:var(--danger); transform:scale(1.05);}
  .fav-heart{transition:transform .12s ease;}
  .fav-heart:active{transform:scale(.88);}
  .fav-heart svg{width:16px; height:16px;}
  .prod-detail-photo{
    position:relative; width:100%; aspect-ratio:1; border-radius:var(--radius); background:var(--surface);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center; overflow:hidden;
    font-size:64px; margin-bottom:14px;
  }
  .prod-detail-photo img{width:100% !important; height:100% !important; object-fit:cover; border-radius:0 !important;}
  .prod-detail-photo .fav-heart{width:38px; height:38px; top:12px; right:12px;}
  .prod-detail-photo .fav-heart svg{width:20px; height:20px;}
  .prod-detail-name{font-size:15px; font-weight:500; color:var(--muted); margin-bottom:6px;}
  .prod-detail-price{font-size:22px; font-weight:800; color:var(--ink); letter-spacing:-.2px; margin-bottom:18px;}
  .prod-detail-price .prod-unit{font-size:13px; font-weight:500; color:var(--muted); margin-left:4px;}
  .prod-detail-actions{margin-top:6px;}
  .orders-view-toggle{display:flex; gap:8px; margin-bottom:12px;}
  .ovt-btn{flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; font-family:'Inter';}
  .ovt-btn.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .orders-day-nav{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
  .day-nav-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
  .day-nav-input{flex:1; padding:9px 10px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:13.5px; font-family:'Inter';}
</style>

<script>
/* ============================================================
   Yaqin Food — Web App
   ВАЖНО: перед деплоем укажите адрес вашего backend (см. backend/README).
   ============================================================ */
const API_BASE = "https://yaqin-food-bot.onrender.com";

const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }
let INIT_DATA = tg ? (tg.initData || "") : "";
async function waitForInitData(maxWaitMs){
  const start = Date.now();
  while(!INIT_DATA && tg && (Date.now()-start) < maxWaitMs){
    await new Promise(r=>setTimeout(r,150));
    INIT_DATA = tg.initData || "";
  }
}

function notify(msg){ if (tg && tg.showAlert) tg.showAlert(msg); else alert(msg); }
function askConfirm(msg){
  return new Promise(resolve=>{
    if (tg && tg.showConfirm) tg.showConfirm(msg, ok=>resolve(ok));
    else resolve(confirm(msg));
  });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return Math.round(n||0).toLocaleString('ru-RU').replace(/,/g,' '); }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit'});
}
function toDateStr(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function todayStr(){ return toDateStr(new Date()); }
function fmtDayLabel(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('ru-RU', {day:'2-digit', month:'long', weekday:'short'});
}
function shiftDateStr(dateStr, delta){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+delta);
  return toDateStr(d);
}
function orderLocalDateStr(iso){
  if(!iso) return '';
  return toDateStr(new Date(iso));
}
function deliveryDateOptions(){
  const out = [];
  for(let i=0;i<5;i++) out.push(shiftDateStr(todayStr(), i));
  return out;
}
function fmtDatePill(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const dow = d.toLocaleDateString('ru-RU', {weekday:'short'});
  return dow.charAt(0).toUpperCase()+dow.slice(1)+' '+d.getDate();
}
const TIME_SLOTS = (function(){ const a=[]; for(let h=8;h<=20;h++) a.push(String(h).padStart(2,'0')+':00'); return a; })();

async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json', 'X-Telegram-Init-Data': INIT_DATA}, opts.headers||{});
  const res = await fetch(API_BASE + path, Object.assign({}, opts, {headers}));
  if(!res.ok){
    const err = new Error('api_error'); err.status = res.status;
    try{ err.body = await res.json(); }catch(e){}
    throw err;
  }
  if(res.status === 204) return null;
  return res.json();
}

    cart: '<circle cx="9" cy="20" r="1.6"/><circle cx="17" cy="20" r="1.6"/><path d="M2.5 3h2.4l2.1 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 7H6"/>',

}

function localGet(key, fallback){
  try{ const v = JSON.parse(localStorage.getItem('yaqin_'+key)); return v==null?fallback:v; }catch(e){ return fallback; }
}
function localSet(key, val){
  try{ localStorage.setItem('yaqin_'+key, JSON.stringify(val)); }catch(e){}
}

let state = {
  ready:false, authError:null, me:null,
  tab:'catalog', view:'grid', detailCatId:null, parentCatId:null,
  overlay:null, orderDetailId:null, adminCatId:null, adminParentCatId:null, productDetailId:null,
  searchQuery:'',
  ordersView:'all', ordersDate:null,
  checkoutDate:null, checkoutTime:null,
  catalog:[], orders:[],
  cart: localGet('cart', []),
  favorites: localGet('favorites', []),
  pendingIconTarget:null,
};

function saveLocal(){ localSet('cart', state.cart); localSet('favorites', state.favorites); }

function allProducts(){
  const out = [];
  function walk(list){
    list.forEach(c=>{
      (c.products||[]).forEach(p=>out.push(Object.assign({categoryId:c.id}, p)));
      if(c.subcategories && c.subcategories.length) walk(c.subcategories);
    });
  }
  walk(state.catalog);
  return out;
}
function findProduct(id){ return allProducts().find(p=>p.id===id); }
function findCategory(id){
  function search(list){
    for(const c of list){
      if(c.id===id) return c;
      if(c.subcategories && c.subcategories.length){ const r=search(c.subcategories); if(r) return r; }
    }
    return null;
  }
  return search(state.catalog);
}

function cartTotalQty(){ return state.cart.reduce((s,i)=>s+i.qty,0); }
function cartTotalSum(){ return state.cart.reduce((s,i)=>s+i.qty*i.price,0); }
function cartQtyFor(name){ const it = state.cart.find(c=>c.name===name); return it?it.qty:0; }

function addToCart(p){
  let it = state.cart.find(c=>c.name===p.name);
  if(it){ it.qty += 1; if(!it.icon && p.icon) it.icon = p.icon; }
  else state.cart.push({name:p.name, unit:p.unit, price:p.price, icon:p.icon||'', qty:1});
  saveLocal();
}
function decFromCart(name){
  let it = state.cart.find(c=>c.name===name);
  if(!it) return;
  it.qty -= 1;
  if(it.qty<=0) state.cart = state.cart.filter(c=>c.name!==name);
  saveLocal();
}
function removeFromCart(name){ state.cart = state.cart.filter(c=>c.name!==name); saveLocal(); }
function setCartQty(p, qty){
  qty = Math.round((qty||0)*100)/100;
  let it = state.cart.find(c=>c.name===p.name);
  if(qty<=0){ state.cart = state.cart.filter(c=>c.name!==p.name); }
  else if(it){ it.qty = qty; }
  else { state.cart.push({name:p.name, unit:p.unit, price:p.price, icon:p.icon||'', qty}); }
  saveLocal();
}

function isFav(name){ return state.favorites.some(f=>f.name===name); }
function toggleFav(p){
  if(isFav(p.name)) state.favorites = state.favorites.filter(f=>f.name!==p.name);
  else state.favorites.push({name:p.name, unit:p.unit, price:p.price});
  saveLocal();
}

/* ---------- ICON RENDERING (emoji ИЛИ фото, загруженное админом) ---------- */
function isImageIcon(v){ return !!v && (v.indexOf('data:')===0 || v.indexOf('http')===0); }
function iconHTML(icon, size, fallback){
  const use = icon || fallback || '';
  if(isImageIcon(use)){
    return '<img src="'+use+'" style="width:'+size+'px;height:'+size+'px;object-fit:cover;border-radius:9px;">';
  }
  return '<span style="font-size:'+size+'px;">'+esc(use||'📦')+'</span>';
}

/* ============================== BOOT ============================== */
async function boot(){
  render();
  await waitForInitData(3000);
  try{
    state.me = await api('/api/me');
  }catch(e){
    state.authError = (e && e.status===403) ? 'no_access' : 'error';
    render();
    return;
  }
  try{ state.catalog = await api('/api/catalog'); }catch(e){}
  try{ state.orders = await api('/api/orders'); }catch(e){}
  state.ready = true;
  render();
}

async function refreshOrders(){ try{ state.orders = await api('/api/orders'); }catch(e){} }
async function refreshCatalog(){ try{ state.catalog = await api('/api/catalog'); }catch(e){} }
async function moveCategorySibling(siblings, catId, dir){
  const idx = siblings.findIndex(c=>c.id===catId);
  const swapIdx = idx + dir;
  if(idx<0 || swapIdx<0 || swapIdx>=siblings.length) return;
  const newOrder = siblings.slice();
  const tmp = newOrder[idx]; newOrder[idx] = newOrder[swapIdx]; newOrder[swapIdx] = tmp;
  try{
    // Перенумеровываем ВСЕХ соседей по порядку — иначе категории, у которых
    // sort_order ещё не задан явно (все новые = 0), «слипаются» и стрелочки
    // выглядят так, будто ничего не делают.
    for(let i=0;i<newOrder.length;i++){
      const c = newOrder[i];
      await api('/api/admin/categories/'+c.id, {method:'PATCH', body: JSON.stringify({name:c.name, icon:c.icon||'', sort_order:i})});
    }
    await refreshCatalog();
    render();
  }catch(err){ notify('Не удалось изменить порядок'); }
}

/* ============================== RENDER ============================== */
function render(){
  try{ renderInner(); }
  catch(e){
    const c = document.getElementById('content');
    if(c) c.innerHTML = '<div class="access-screen"><div class="e">⚠️</div><h2>Что-то пошло не так</h2><p>Попробуйте вернуться назад или открыть приложение заново.</p><button class="back" data-back style="margin:16px auto 0;width:auto;padding:0 16px;">Назад</button></div>';
  }
}
function renderInner(){
  document.querySelectorAll('.navbtn').forEach(b=>{
    b.innerHTML = ({catalog:ico('grid'), cart:'<span style="position:relative;display:inline-flex">'+ico('cart')+'<span class="badge" id="cart-badge" style="display:none"></span></span>', orders:ico('orders'), templates:ico('templates')}[b.dataset.tab]||'') + '<span>'+({catalog:'Каталог',cart:'Корзина',orders:'Заказы',templates:'Шаблоны'}[b.dataset.tab]||'')+'</span>';
    b.classList.toggle('active', b.dataset.tab===state.tab && !state.overlay);
  });
  document.querySelectorAll('.topbar-icons .icon-btn')[0].innerHTML = ico('search',20);
  document.querySelectorAll('.topbar-icons .icon-btn')[1].innerHTML = (isFav(null)?'':'') + ico('heart',19) + '<span class="fav-badge" id="fav-badge" style="display:'+(state.favorites.length?'flex':'none')+'">'+state.favorites.length+'</span>';
  document.querySelectorAll('.topbar-icons .icon-btn')[2].innerHTML = ico('user',20);

  const c = document.getElementById('content');
  const bottomnav = document.getElementById('bottomnav');
  bottomnav.style.display = state.ready ? 'flex' : 'none';

  if(state.authError){ c.innerHTML = renderAccessError(); return; }
  if(!state.ready){ c.innerHTML = renderLoading(); return; }

  if(state.overlay==='search') c.innerHTML = renderSearch();
  else if(state.overlay==='favorites') c.innerHTML = renderFavorites();
  else if(state.overlay==='profile') c.innerHTML = renderProfile();
  else if(state.overlay==='orderDetail') c.innerHTML = renderOrderDetail();
  else if(state.overlay==='adminCatalog') c.innerHTML = renderAdminCatalog();
  else if(state.overlay==='adminCatalogCat') c.innerHTML = renderAdminCatalogCat();
  else if(state.overlay==='adminUsers') c.innerHTML = renderAdminUsers();
  else if(state.overlay==='productDetail') c.innerHTML = renderProductDetail();
  else if(state.tab==='catalog') c.innerHTML = state.view==='grid' ? renderCatalogGrid() : (state.view==='subcats' ? renderSubcatGrid() : renderCatalogDetail());
  else if(state.tab==='cart') c.innerHTML = renderCart();
  else if(state.tab==='orders') c.innerHTML = renderOrdersList();
  else if(state.tab==='templates') c.innerHTML = renderTemplates();

  updateCartBadge();
}

function updateCartBadge(){
  const b = document.getElementById('cart-badge');
  if(!b) return;
  const q = state.cart.length;
  b.style.display = q>0 ? 'flex' : 'none';
  b.textContent = q;
}

function renderLoading(){
  return '<div class="loading-screen"><div class="loading-spinner"></div><p>Загрузка…</p></div>';
}
function renderAccessError(){

    return '<div class="access-screen"><div class="e">🔒</div><h2>Нет доступа</h2><p>Ваш Telegram-аккаунт ещё не добавлен в систему. Обратитесь к администратору Yaqin Food, чтобы он выдал вам доступ.</p></div>';

  const tiles = state.catalog.map(cat=>
    '<div class="tile" data-open-cat="'+cat.id+'">'+
      '<div class="tile-icon">'+iconHTML(cat.icon, 26)+'</div>'+
      '<div class="tile-title">'+esc(cat.name)+'</div>'+

}
function renderSubcatGrid(){
  const cat = findCategory(state.parentCatId);
  if(!cat) return renderCatalogGrid();
  const subTiles = (cat.subcategories||[]).map(sc=>
    '<div class="tile" data-open-subcat="'+sc.id+'">'+
      '<div class="tile-icon">'+iconHTML(sc.icon, 26, cat.icon)+'</div>'+

  ).join('');

    ? '<div class="section-label">Другие товары</div>'+productGridHTML(cat.products, cat)
    : '';
  return (
    '<div class="detail-head"><button class="back" data-back>'+ico('back',18)+'</button><h2>'+esc(cat.name)+'</h2></div>'+
    '<div class="grid">'+subTiles+'</div>'+

}
function qtyControlsHTML(p){
  const q = cartQtyFor(p.name);
  if(!p.in_stock) return '<div class="oos-label">Нет в наличии</div>';
  if(q<=0) return '<button class="btn-add-tile" data-add-prod="'+p.id+'">+ Добавить</button>';
  return '<div class="tile-qty"><button data-dec-prod="'+p.id+'">−</button>'+
    '<input type="number" inputmode="decimal" step="0.1" min="0" class="qty-input" data-qty-input="'+p.id+'" value="'+q+'">'+
    '<button data-add-prod="'+p.id+'">+</button></div>';
}
function discountPct(p){
  if(!p.old_price || p.old_price<=p.price) return 0;
  return Math.round((1 - p.price/p.old_price)*100);
}
function productGridHTML(products, cat){
  const tiles = products.map(p=>{
    try{
      const disc = discountPct(p);
      return '<div class="prod-tile'+(p.in_stock?'':' out-of-stock')+'">'+
        '<div class="prod-photo" data-open-product="'+p.id+'">'+iconHTML(p.icon, 30, cat.icon)+
          (disc>0 ? '<span class="discount-tag">'+ico('down',11)+' -'+disc+'%</span>' : '')+
          '<button class="fav-heart'+(isFav(p.name)?' active':'')+'" data-toggle-fav="'+esc(p.name)+'" data-toggle-fav-unit="'+esc(p.unit)+'" data-toggle-fav-price="'+p.price+'" type="button">'+ico(isFav(p.name)?'heartFill':'heart',16)+'</button>'+
        '</div>'+
        '<div class="prod-name">'+esc(p.name)+'</div>'+
        '<div class="prod-price">'+fmt(p.price)+' сум'+(disc>0?' <span class="discount-badge">'+ico('down',10)+disc+'%</span>':'')+'<span class="prod-unit">/ '+esc(p.unit)+'</span></div>'+
        qtyControlsHTML(p)+
      '</div>';
    }catch(e){ return ''; }
  }).join('');
  return tiles.trim() ? '<div class="prod-grid">'+tiles+'</div>' : '<div class="empty">В этой категории пока нет товаров</div>';
}

  const items = o.items.map(i=>{
    let actions = '';
    if(i.status==='pending'){
      actions = '<div class="admin-item-actions">'+
        '<button class="btn btn-small btn-primary" data-item-accept="'+o.id+':'+i.id+'">Принять</button>'+
        '<button class="btn btn-small btn-danger" data-item-reject-open="'+o.id+':'+i.id+'">Отказаться</button>'+
        '</div><div class="reason-box" id="reason-box-'+i.id+'" style="display:none;">'+
          '<input placeholder="Причина (например: нет на складе)" id="reason-input-'+i.id+'">'+
          '<button class="btn btn-small btn-danger" data-item-reject-confirm="'+o.id+':'+i.id+'">ОК</button>'+
        '</div>';
    } else if(i.status==='rejected'){
      actions = '<div class="muted-small">Причина: '+esc(i.reject_reason||'—')+'</div>';
    }
    const deliveredVal = (i.delivered_qty!=null ? i.delivered_qty : i.qty);
    const deliveredBlock = i.status!=='rejected' ?
      '<div class="delivered-box"><span class="delivered-label">Принято по факту</span>'+
        '<input type="number" inputmode="decimal" step="0.1" min="0" class="qty-input" id="delivered-input-'+i.id+'" value="'+deliveredVal+'">'+
        '<span class="delivered-unit">'+esc(i.unit)+'</span>'+
        '<button class="btn btn-small btn-ghost" data-save-delivered="'+o.id+':'+i.id+'">Сохранить</button>'+
      '</div>' : '';
    return '<div class="order-item-row">'+
      '<div class="item-status-top"><span class="item-status item-status-'+i.status+'">'+({pending:'Ожидает',accepted:'Принято',rejected:'Отменено'}[i.status])+'</span></div>'+
      '<div class="order-item-top">'+
      '<div class="order-item-photo">'+iconHTML(i.icon, 24, '')+'</div>'+
      '<div><div class="item-name">'+esc(i.product_name)+'</div><div class="item-price">'+i.qty+' '+esc(i.unit)+' × '+fmt(i.price)+' сум</div></div>'+
      '</div>'+actions+deliveredBlock+'</div>';
  }).join('');
  return head + items;
}

/* ============================== ДЕЙСТВИЯ ============================== */
function goBack(){
  if(state.overlay==='adminCatalogCat'){
    if(state.adminParentCatId){ state.adminCatId = state.adminParentCatId; state.adminParentCatId = null; render(); return; }
    state.overlay='adminCatalog'; state.adminCatId=null; render(); return;
  }
  if(state.overlay==='productDetail'){ state.overlay=null; state.productDetailId=null; render(); return; }
  if(state.overlay){ state.overlay=null; state.orderDetailId=null; render(); return; }
  if(state.tab==='catalog' && state.view==='detail'){
    if(state.parentCatId){ state.view='subcats'; state.detailCatId=null; render(); return; }
    state.view='grid'; state.detailCatId=null; render(); return;
  }
  if(state.tab==='catalog' && state.view==='subcats'){ state.view='grid'; state.parentCatId=null; render(); return; }
}

let checkoutInProgress = false;
async function doCheckout(){
  if(!state.cart.length || checkoutInProgress) return;
  checkoutInProgress = true;
  const btn = document.querySelector('[data-checkout]');
  if(btn){ btn.disabled = true; btn.textContent = 'Оформляем…'; }
  const paymentEl = document.getElementById('checkout-payment');
  const commentEl = document.getElementById('checkout-comment');
  let deliveryTime = null;
  if(state.checkoutDate && state.checkoutTime){
    deliveryTime = state.checkoutDate+'T'+state.checkoutTime+':00';
  }
  try{
    await api('/api/orders', {method:'POST', body: JSON.stringify({
      items: state.cart.map(i=>({name:i.name, unit:i.unit, qty:i.qty, price:i.price, icon:i.icon||''})),
      payment_method: paymentEl ? paymentEl.value : '',
      comment: commentEl ? commentEl.value : '',
      delivery_time: deliveryTime
    })});
    state.cart = [];
    state.checkoutDate = null; state.checkoutTime = null;
    saveLocal();
    await refreshOrders();
    state.tab = 'orders'; state.overlay = null;
    notify('Заказ оформлен! Мы уведомили менеджера.');
    render();
  }catch(e){
    notify('Не удалось оформить заказ. Попробуйте ещё раз.');
    if(btn){ btn.disabled = false; btn.textContent = 'Оформить заказ'; }
  }finally{
    checkoutInProgress = false;
  }
}

const contentEl = document.getElementById('content');
const bottomnavEl = document.getElementById('bottomnav');
const appEl = document.getElementById('app');

appEl.addEventListener('click', async (e)=>{
  let el;
  if(el = e.target.closest('[data-tab]')){ state.tab = el.dataset.tab; state.view='grid'; state.parentCatId=null; state.detailCatId=null; state.overlay=null; render(); return; }
  if(el = e.target.closest('[data-go-home]')){ state.tab='catalog'; state.view='grid'; state.parentCatId=null; state.detailCatId=null; state.overlay=null; render(); return; }
  if(el = e.target.closest('[data-orders-view]')){ state.ordersView = el.dataset.ordersView; if(state.ordersView==='day' && !state.ordersDate) state.ordersDate = todayStr(); render(); return; }
  if(el = e.target.closest('[data-orders-day-prev]')){ state.ordersDate = shiftDateStr(state.ordersDate||todayStr(), -1); render(); return; }
  if(el = e.target.closest('[data-orders-day-next]')){ state.ordersDate = shiftDateStr(state.ordersDate||todayStr(), 1); render(); return; }
  if(el = e.target.closest('[data-open-overlay]')){
    state.overlay = el.dataset.openOverlay;
    if(state.overlay==='search') state.searchQuery='';
    if(state.overlay==='adminUsers'){ try{ adminUsersCache = await api('/api/admin/users'); }catch(err){ notify('Не удалось загрузить пользователей'); } }
    render();
    return;
  }
  if(el = e.target.closest('[data-back]')){ goBack(); return; }
  if(el = e.target.closest('[data-open-cat]')){
    const cat = findCategory(+el.dataset.openCat);
    if(cat && cat.subcategories && cat.subcategories.length){ state.parentCatId = cat.id; state.view='subcats'; }
    else { state.detailCatId = +el.dataset.openCat; state.view='detail'; }
    state.overlay=null; render(); return;
  }
  if(el = e.target.closest('[data-open-subcat]')){ state.detailCatId = +el.dataset.openSubcat; state.view='detail'; state.overlay=null; render(); return; }
  if(el = e.target.closest('[data-toggle-fav]')){
    const name = el.dataset.toggleFav;
    const p = { name, unit: el.dataset.toggleFavUnit||'', price: +el.dataset.toggleFavPrice||0 };
    toggleFav(p); saveLocal(); render(); return;
  }
  if(el = e.target.closest('[data-open-product]')){ state.productDetailId = +el.dataset.openProduct; state.overlay='productDetail'; render(); return; }

  if(el = e.target.closest('[data-add-prod]')){
    const p = findProduct(+el.dataset.addProd); if(p) addToCart(p);
    if(state.overlay==='search'){ document.getElementById('search-results').innerHTML = searchResultsHTML(); updateCartBadge(); }
    else render();
    return;
  }
  if(el = e.target.closest('[data-dec-prod]')){
    const p = findProduct(+el.dataset.decProd); if(p) decFromCart(p.name); render(); return;
  }
  if(el = e.target.closest('[data-cart-inc]')){ addToCart({name:el.dataset.cartInc, unit:'', price:0}); const it=state.cart.find(c=>c.name===el.dataset.cartInc); render(); return; }
  if(el = e.target.closest('[data-cart-dec]')){ decFromCart(el.dataset.cartDec); render(); return; }
  if(el = e.target.closest('[data-cart-remove]')){ removeFromCart(el.dataset.cartRemove); render(); return; }
  if(el = e.target.closest('[data-checkout]')){ doCheckout(); return; }
  if(el = e.target.closest('[data-goto-catalog]')){ state.tab='catalog'; state.view='grid'; render(); return; }
  if(el = e.target.closest('[data-checkout-date]')){ state.checkoutDate = el.dataset.checkoutDate; render(); return; }
  if(el = e.target.closest('[data-checkout-time]')){ state.checkoutTime = el.dataset.checkoutTime; render(); return; }

  if(el = e.target.closest('[data-add-fav]')){
    const f = state.favorites.find(x=>x.name===el.dataset.addFav);
    if(f) addToCart(f);
    render(); return;
  }
  if(el = e.target.closest('[data-remove-fav]')){ state.favorites = state.favorites.filter(f=>f.name!==el.dataset.removeFav); saveLocal(); render(); return; }

  if(el = e.target.closest('[data-open-order]')){
    state.orderDetailId = +el.dataset.openOrder; state.overlay='orderDetail'; render(); return;
  }
  if(el = e.target.closest('[data-reorder]')){
    const o = state.orders.find(x=>x.id===+el.dataset.reorder);
    if(o){ o.items.forEach(i=>addToCart({name:i.product_name, unit:i.unit, price:i.price, icon:i.icon||''})); notify('Товары добавлены в корзину'); render(); }
    return;
  }
  if(el = e.target.closest('[data-cancel-order]')){
    const oid = +el.dataset.cancelOrder;
    try{
      const o = await api('/api/orders/'+oid+'/status', {method:'PATCH', body: JSON.stringify({status:'cancelled'})});
      state.orders = state.orders.map(x=>x.id===o.id?o:x);
      notify('Заказ отменён');
      render();
    }catch(err){ notify('Не удалось отменить заказ'); }
    return;
  }
  if(el = e.target.closest('[data-save-order-comment]')){
    const oid = +el.dataset.saveOrderComment;
    const val = document.getElementById('order-comment-input');
    try{
      const o = await api('/api/orders/'+oid, {method:'PATCH', body: JSON.stringify({comment: val?val.value:''})});
      state.orders = state.orders.map(x=>x.id===o.id?o:x);
      notify('Комментарий сохранён');
      render();
    }catch(err){ notify('Не удалось сохранить'); }
    return;
  }
  if(el = e.target.closest('[data-item-accept]')){
    const [oid,iid] = el.dataset.itemAccept.split(':').map(Number);
    try{ const o = await api('/api/orders/'+oid+'/items/'+iid, {method:'PATCH', body: JSON.stringify({status:'accepted'})});
      state.orders = state.orders.map(x=>x.id===o.id?o:x); render(); }catch(err){ notify('Ошибка'); }
    return;
  }
  if(el = e.target.closest('[data-item-reject-open]')){
    const iid = el.dataset.itemRejectOpen.split(':')[1];
    const box = document.getElementById('reason-box-'+iid);
    if(box) box.style.display='flex';
    return;
  }
  if(el = e.target.closest('[data-item-reject-confirm]')){
    const [oid,iid] = el.dataset.itemRejectConfirm.split(':').map(Number);
    const input = document.getElementById('reason-input-'+iid);
    const reason = (input && input.value.trim()) || 'Нет в наличии';
    try{ const o = await api('/api/orders/'+oid+'/items/'+iid, {method:'PATCH', body: JSON.stringify({status:'rejected', reject_reason:reason})});
      state.orders = state.orders.map(x=>x.id===o.id?o:x); render(); }catch(err){ notify('Ошибка'); }
    return;
  }
  if(el = e.target.closest('[data-save-delivered]')){
    const [oid,iid] = el.dataset.saveDelivered.split(':').map(Number);
    const input = document.getElementById('delivered-input-'+iid);
    const qty = input ? parseFloat(input.value) : NaN;
    if(isNaN(qty) || qty<0){ notify('Введите корректное количество'); return; }
    try{
      const o = await api('/api/orders/'+oid+'/items/'+iid, {method:'PATCH', body: JSON.stringify({delivered_qty: qty})});
      state.orders = state.orders.map(x=>x.id===o.id?o:x);
      notify('Количество обновлено');
      render();
    }catch(err){ notify('Не удалось сохранить'); }
    return;
  }

  if(el = e.target.closest('[data-open-admin-cat]')){ state.adminCatId = +el.dataset.openAdminCat; state.adminParentCatId = null; state.overlay='adminCatalogCat'; render(); return; }
  if(el = e.target.closest('[data-open-admin-subcat]')){ state.adminParentCatId = +el.dataset.parentCat; state.adminCatId = +el.dataset.openAdminSubcat; state.overlay='adminCatalogCat'; render(); return; }
  if(el = e.target.closest('[data-cat-up]')){ await moveCategorySibling(state.catalog, +el.dataset.catUp, -1); return; }
  if(el = e.target.closest('[data-cat-down]')){ await moveCategorySibling(state.catalog, +el.dataset.catDown, 1); return; }
  if(el = e.target.closest('[data-subcat-up]')){
    const parent = findCategory(state.adminCatId);
    if(parent) await moveCategorySibling(parent.subcategories||[], +el.dataset.subcatUp, -1);
    return;
  }
  if(el = e.target.closest('[data-subcat-down]')){
    const parent = findCategory(state.adminCatId);
    if(parent) await moveCategorySibling(parent.subcategories||[], +el.dataset.subcatDown, 1);
    return;
  }
  if(el = e.target.closest('[data-admin-del-cat]')){
    if(!await askConfirm('Удалить категорию вместе со всеми товарами в ней?')) return;
    try{ await api('/api/admin/categories/'+el.dataset.adminDelCat, {method:'DELETE'}); await refreshCatalog(); render(); }catch(err){ notify('Ошибка'); }
    return;
  }
  if(el = e.target.closest('[data-admin-del-prod]')){
    if(!await askConfirm('Удалить товар?')) return;
    try{ await api('/api/admin/products/'+el.dataset.adminDelProd, {method:'DELETE'}); await refreshCatalog(); render(); }catch(err){ notify('Ошибка'); }
    return;
  }
  if(el = e.target.closest('[data-admin-del-user]')){
    if(!await askConfirm('Убрать доступ у этого пользователя?')) return;
    try{ await api('/api/admin/users/'+el.dataset.adminDelUser, {method:'DELETE'}); adminUsersCache = await api('/api/admin/users'); render(); }catch(err){ notify('Ошибка'); }
    return;
  }

  if(el = e.target.closest('[data-icon-upload-cat]')){ state.pendingIconTarget = {type:'category', id:+el.dataset.iconUploadCat}; document.getElementById('icon-file-input').click(); return; }
  if(el = e.target.closest('[data-icon-upload-prod]')){ state.pendingIconTarget = {type:'product', id:+el.dataset.iconUploadProd}; document.getElementById('icon-file-input').click(); return; }

  if(el = e.target.closest('[data-use-template]')){
    const tpls = localGet('templates', []);
    const t = tpls.find(x=>x.id===el.dataset.useTemplate);
    if(t){ t.items.forEach(it=>addToCart(it)); state.tab='cart'; render(); }
    return;
  }
  if(el = e.target.closest('[data-save-template]')){
    const tpls = localGet('templates', []);
    tpls.unshift({id:'t'+Date.now(), title:'Шаблон от '+new Date().toLocaleDateString('ru-RU'), items: state.cart.map(i=>Object.assign({},i))});
    localSet('templates', tpls);
    notify('Шаблон сохранён'); render();
    return;
  }
});

contentEl.addEventListener('input', (e)=>{
  if(e.target.id==='search-input'){
    state.searchQuery = e.target.value;
    document.getElementById('search-results').innerHTML = searchResultsHTML();
  }
});

contentEl.addEventListener('change', async (e)=>{
  if(e.target.id==='orders-date-input'){
    state.ordersDate = e.target.value || todayStr(); render(); return;
  }
  if(e.target.matches('[data-qty-input]')){
    const p = findProduct(+e.target.dataset.qtyInput);
    if(p) setCartQty(p, parseFloat(e.target.value.replace(',','.'))||0);
    if(state.overlay==='search'){ document.getElementById('search-results').innerHTML = searchResultsHTML(); updateCartBadge(); }
    else render();
    return;
  }
  if(e.target.matches('[data-cart-qty-input]')){
    const name = e.target.dataset.cartQtyInput;
    const it = state.cart.find(c=>c.name===name);
    if(it) setCartQty({name: it.name, unit: it.unit, price: it.price}, parseFloat(e.target.value.replace(',','.'))||0);
    render();
    return;
  }
  if(e.target.matches('[data-order-status-select]')){
    const oid = +e.target.dataset.orderStatusSelect;
    try{ const o = await api('/api/orders/'+oid+'/status', {method:'PATCH', body: JSON.stringify({status: e.target.value})});
      state.orders = state.orders.map(x=>x.id===o.id?o:x); }catch(err){ notify('Ошибка'); }
  }
});

contentEl.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const form = e.target;
  const kind = form.dataset.form;
  const fd = new FormData(form);
  try{
    if(kind==='add-category'){
      await api('/api/admin/categories', {method:'POST', body: JSON.stringify({name: fd.get('name')})});
      await refreshCatalog(); render();
    } else if(kind==='add-subcategory'){
      await api('/api/admin/categories', {method:'POST', body: JSON.stringify({name: fd.get('name'), parent_id: +form.dataset.cat})});
      await refreshCatalog(); render();
    } else if(kind==='add-product'){
      await api('/api/admin/products', {method:'POST', body: JSON.stringify({
        category_id: +form.dataset.cat, name: fd.get('name'), unit: fd.get('unit')||'кг', price: +fd.get('price')||0,
        old_price: fd.get('old_price') ? +fd.get('old_price') : null
      })});
      await refreshCatalog(); render();
    } else if(kind==='edit-product'){
      const id = +form.dataset.id;
      const p = findProduct(id);
      await api('/api/admin/products/'+id, {method:'PATCH', body: JSON.stringify({
        category_id: p.categoryId, name: fd.get('name'), unit: fd.get('unit'), price: +fd.get('price')||0,
        old_price: fd.get('old_price') ? +fd.get('old_price') : null,
        in_stock: fd.get('in_stock')==='on', icon: p.icon||''
      })});
      await refreshCatalog(); render();
      notify('Сохранено');
    } else if(kind==='add-user'){
      await api('/api/admin/users', {method:'POST', body: JSON.stringify({
        telegram_id: fd.get('telegram_id'), name: fd.get('name')||'', restaurant: fd.get('restaurant')||'',
        position: fd.get('position')||'', role: fd.get('role')||'user'
      })});
      adminUsersCache = await api('/api/admin/users'); form.reset(); render();
      notify('Доступ выдан');
    } else if(kind==='edit-user'){
      const id = +form.dataset.id;
      const u = adminUsersCache.find(x=>x.id===id);
      await api('/api/admin/users/'+id, {method:'PATCH', body: JSON.stringify({
        telegram_id: u.telegram_id, name: fd.get('name')||'', restaurant: fd.get('restaurant')||'',
        position: fd.get('position')||'', role: fd.get('role')||'user', is_active: fd.get('is_active')==='on',
        credit_limit: +fd.get('credit_limit')||0, credit_balance: +fd.get('credit_balance')||0
      })});
      adminUsersCache = await api('/api/admin/users'); render();
      notify('Сохранено');
    }
  }catch(err){ notify('Не удалось сохранить. Проверьте данные.'); }
});

function fileToResizedDataURL(file, maxSize, quality){
  maxSize = maxSize || 1000; quality = quality || 0.9;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxSize){ h=Math.round(h*maxSize/w); w=maxSize; } }
        else { if(h>maxSize){ w=Math.round(w*maxSize/h); h=maxSize; } }
        const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('icon-file-input').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  const target = state.pendingIconTarget;
  e.target.value = '';
  if(!file || !target) return;
  try{
    const dataUrl = await fileToResizedDataURL(file);
    if(target.type==='category'){
      const cat = findCategory(target.id);
      await api('/api/admin/categories/'+target.id, {method:'PATCH', body: JSON.stringify({name: cat.name, icon: dataUrl})});
    } else {
      const p = findProduct(target.id);
      await api('/api/admin/products/'+target.id, {method:'PATCH', body: JSON.stringify({
        category_id: p.categoryId, name: p.name, unit: p.unit, price: p.price, in_stock: p.in_stock, icon: dataUrl
      })});
    }
    await refreshCatalog(); render();
  }catch(err){ notify('Не удалось загрузить фото'); }
});

/* ---------- Свайп влево — назад ---------- */
let touchStartX=null, touchStartY=null;
document.addEventListener('touchstart', e=>{
  if(e.touches.length!==1) return;
  touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', e=>{
  if(touchStartX===null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  touchStartX = null;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5 && dx < 0) goBack();
}, {passive:true});

boot();
</script>
