<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yaqin Food — HoReCa &amp; Distribution</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚚</text></svg>">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --surface:#FFFFFF; --ink:#101211; --muted:#6B6E6A;
    --accent:#FF5103; --accent-deep:#D8440A; --transit:#3F7D58;
    --danger:#B3472B; --border:#E7E5DE; --radius:14px; --pill:#F0EFE9; --field-bg:#F7F6F1;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14130F; --surface:#1E1C17; --ink:#F5F3EC; --muted:#A7A399;
      --border:#332F27; --pill:#2A2820; --field-bg:#221F19;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14130F; --surface:#1E1C17; --ink:#F5F3EC; --muted:#A7A399;
    --border:#332F27; --pill:#2A2820; --field-bg:#221F19;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
  *{box-sizing:border-box;}
  body{
    margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.num{font-family:'Barlow Condensed',Impact,sans-serif; font-weight:700;}
  .app{max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; background:var(--bg);}
  .topbar{
    position:sticky; top:0; z-index:10; padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px;
    background:var(--bg); color:var(--ink); display:flex; align-items:center; justify-content:space-between;
    gap:8px; border-bottom:1px solid var(--border);
  }
  .topbar-left{display:flex; align-items:center; gap:11px; min-width:0;}
  .topbar .logo{width:52px;height:52px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;cursor:pointer;}
  .topbar .logo:active{transform:scale(.94);}
  .topbar .logo img{width:100%;height:100%;object-fit:contain;padding:6px;}
  .topbar .brand{font-size:20px; line-height:1.1; letter-spacing:.2px;}
  .topbar .tagline{font-family:'Inter'; font-size:11px; color:var(--muted); font-weight:500; margin-top:1px;}
  .topbar-icons{display:flex; align-items:center; gap:1px; flex:none;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--ink);position:relative;padding:9px;line-height:1;border-radius:10px;display:flex;}
  .icon-btn:active{background:var(--surface);}
  .fav-badge, .cart-badge-top{
    position:absolute; top:3px; right:3px; background:var(--accent-deep); color:#fff; font-size:9px; font-weight:700;
    border-radius:8px; min-width:14px; height:14px; display:flex; align-items:center; justify-content:center; padding:0 3px;
  }
  .content{flex:1; padding:16px 16px 96px; overflow-x:hidden;}
  .search{
    width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font-size:14px; margin-bottom:14px;
  }
  .grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:11px;}
  .tile{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    overflow:hidden; cursor:pointer; display:flex; flex-direction:column; text-align:center;
    box-shadow:0 2px 0 rgba(0,0,0,.04), 0 6px 14px rgba(16,18,17,.06);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .tile:active{ transform:scale(.96); box-shadow:0 1px 0 rgba(0,0,0,.04), 0 2px 6px rgba(16,18,17,.06); }
  .tile-icon{width:100%; aspect-ratio:1; background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:34px; flex:none;}
  .tile-icon img{width:100% !important; height:100% !important; object-fit:cover; border-radius:0 !important;}
  .tile-title{font-size:12.5px; font-weight:600; line-height:1.25; padding:10px 8px 14px;}
  .section-label{font-size:13px; color:var(--muted); font-weight:600; margin:18px 0 10px;}
  .detail-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .back{border:none; background:var(--surface); border:1px solid var(--border); width:36px;height:36px;border-radius:10px; color:var(--ink); cursor:pointer; display:flex;align-items:center;justify-content:center; flex:none;}
  .detail-head h2{margin:0; font-size:19px; line-height:1.2;}
  .prod-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .prod-tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px; display:flex; flex-direction:column; gap:8px; position:relative;}
  .prod-tile.out-of-stock{opacity:.55;}
  .prod-photo{width:100%; aspect-ratio:1; border-radius:12px; background:var(--bg); display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:36px; position:relative;}
  .prod-photo img{width:100% !important;height:100% !important;object-fit:cover;border-radius:0 !important;}
  .prod-name{font-size:12.5px; font-weight:500; line-height:1.3; color:var(--muted);}
  .prod-price{font-size:16.5px; font-weight:800; color:var(--ink); letter-spacing:-.2px;}
  .prod-price .prod-unit{font-size:11.5px; font-weight:500; color:var(--muted); margin-left:3px;}
  .discount-badge{display:inline-flex; align-items:center; gap:1px; color:var(--danger); font-size:11.5px; font-weight:700; vertical-align:middle;}
  .discount-badge svg{width:10px;height:10px;}
  .discount-tag{position:absolute; top:8px; left:8px; display:inline-flex; align-items:center; gap:2px; background:var(--danger); color:#fff; font-size:10.5px; font-weight:700; padding:3px 7px; border-radius:20px; z-index:1;}
  .discount-tag svg{width:11px;height:11px;}
  .old-price{font-size:12px; color:var(--muted); text-decoration:line-through; font-weight:500; margin-left:4px;}
  .oos-label{font-size:11.5px; font-weight:700; color:var(--danger);}
  .btn-add-tile{border:none; background:var(--pill); color:var(--ink); font-size:12.5px; font-weight:700; padding:9px; border-radius:999px; cursor:pointer; width:100%;}
  .tile-qty{display:flex; align-items:center; justify-content:space-between; background:var(--pill); border:none; border-radius:999px; padding:4px 6px;}
  .tile-qty button{width:26px;height:26px;border-radius:50%;border:none;background:var(--surface);color:var(--ink);font-size:16px;cursor:pointer;}
  .tile-qty span{font-weight:700; font-size:14px;}
  input.qty-input{width:44px; border:none; background:transparent; text-align:center; font-weight:700; font-size:14px; color:var(--ink); padding:0; font-family:'Inter'; -moz-appearance:textfield;}
  input.qty-input::-webkit-outer-spin-button, input.qty-input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  input.qty-input:focus{outline:none;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; font-weight:600; margin-bottom:5px; color:var(--muted);}
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--field-bg); color:var(--ink); font-size:14.5px; font-family:'Inter';
  }
  .field textarea{ resize:none; min-height:100px; }
  .price-box{
    background:var(--bg); border:1px dashed var(--border); border-radius:10px; padding:12px 14px;
    display:flex; justify-content:space-between; align-items:center; margin:16px 0;
  }
  .price-box .num{font-size:22px; color:var(--accent-deep);}
  .btn{width:100%; padding:13px; border-radius:10px; border:none; font-size:15px; font-weight:600; cursor:pointer; font-family:'Inter';}
  .btn-primary{background:var(--accent); color:#fff; box-shadow:0 3px 10px rgba(255,81,3,.28);}
  .btn-primary:active{background:var(--accent-deep);}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--muted); border:1px solid var(--border);}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn-small{width:auto; padding:8px 12px; font-size:12.5px; border-radius:8px;}
  .item-row{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--border);}
  .item-row:last-child{border-bottom:none;}
  .item-name{font-size:14px; font-weight:500;}
  .item-price{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .qty{display:flex; align-items:center; gap:10px; width:fit-content; border:1px solid var(--ink); border-radius:10px; padding:3px 4px;}
  .qty button{width:28px; height:28px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:16px; cursor:pointer;}
  .qty span{min-width:16px; text-align:center; font-size:14px; font-weight:600;}
  .cart-card{background:var(--surface); border:none; box-shadow:0 1px 0 rgba(16,18,17,.05), 0 4px 12px rgba(16,18,17,.05); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;}
  .cart-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
  .cart-card-photo{width:88px; height:88px; border-radius:16px; background:var(--bg); border:none; display:flex; align-items:center; justify-content:center; overflow:hidden; flex:none; font-size:32px;}
  .cart-card-photo img{width:100% !important; height:100% !important; object-fit:cover; border-radius:0 !important;}
  .cart-card-title{font-weight:600; font-size:14.5px; overflow-wrap:anywhere; word-break:break-word;}
  .cart-card-meta{font-size:12px; color:var(--muted); margin-top:4px; overflow-wrap:anywhere; word-break:break-word;}
  .cart-card-price{font-weight:700; font-size:15px; white-space:nowrap;}
  .remove{border:none; background:none; color:var(--danger); font-size:12.5px; cursor:pointer; padding:0; text-align:right;}
  .cart-card-row{display:flex; align-items:flex-start; gap:12px;}
  .cart-card-info{flex:1; min-width:0;}
  .cart-qty{flex:none;}
  .cart-qty .qty-num-wrap{display:flex; flex-direction:column; align-items:center; line-height:1;}
  .cart-qty input.qty-input{width:40px;}
  .qty-unit{font-size:9.5px; color:var(--muted); margin-top:1px;}
  .cart-card-bottom{display:flex; justify-content:space-between; align-items:center; margin-top:10px;}
  .cart-card-total{font-weight:700; font-size:13.5px; color:var(--muted);}
  .total-bar{background:var(--surface); box-shadow:0 1px 0 rgba(16,18,17,.05), 0 4px 12px rgba(16,18,17,.05); border-radius:var(--radius); padding:14px 16px; margin-top:14px; display:flex; flex-direction:column; gap:10px;}
  .total-row{display:flex; justify-content:space-between; font-size:15px; font-weight:600;}
  .empty{text-align:center; color:var(--muted); padding:60px 20px; font-size:14px;}
  .empty .e-icon{font-size:36px; display:block; margin-bottom:10px;}
  .empty-cart{text-align:center; padding:64px 24px 30px;}
  .empty-cart .ec-icon{width:84px; height:84px; border-radius:22px; background:var(--pill); color:var(--accent); display:flex; align-items:center; justify-content:center; margin:0 auto 18px;}
  .empty-cart .ec-icon svg{width:38px; height:38px;}
  .empty-cart h3{font-size:18px; margin:0 0 8px;}
  .empty-cart p{font-size:13.5px; color:var(--muted); margin:0 0 24px; line-height:1.45;}
  .empty-cart .ec-btn{width:auto; padding:13px 30px; border-radius:999px; display:inline-block;}
  .checkout-details{background:var(--surface); border:none; box-shadow:0 1px 0 rgba(16,18,17,.05), 0 4px 12px rgba(16,18,17,.05); border-radius:var(--radius); padding:16px; margin-top:14px;}
  .date-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px;}
  .date-pill{flex:none; border:1px solid var(--border); background:var(--field-bg); color:var(--ink); font-size:12.5px; font-weight:600; padding:9px 13px; border-radius:12px; cursor:pointer; font-family:'Inter';}
  .date-pill.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .time-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .time-slot{border:1px solid var(--border); background:var(--field-bg); color:var(--ink); font-size:13px; font-weight:600; padding:9px 0; border-radius:10px; cursor:pointer; font-family:'Inter';}
  .time-slot.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .order-item-photo{width:92px; height:92px; border-radius:16px; background:var(--bg); border:none; display:flex; align-items:center; justify-content:center; overflow:hidden; flex:none; font-size:34px;}
  .order-item-photo img{width:100% !important; height:100% !important; object-fit:cover; border-radius:0 !important;}
  .order-item-info{flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:7px;}
  .delivered-box{display:flex; align-items:center; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border);}
  .delivered-label{font-size:12px; color:var(--muted); flex:1;}
  .delivered-box input.qty-input{width:56px; border:1px solid var(--ink); border-radius:8px; padding:6px 4px;}
  .delivered-unit{font-size:12px; color:var(--muted);}
  .item-qty-inline{display:flex; align-items:center; gap:4px;}
  .item-qty-inline input.qty-input{width:46px; border:1px solid var(--ink); border-radius:8px; padding:6px 3px; text-align:center; font-size:13px;}
  .item-detail-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-top:1px solid var(--border);}
  .item-detail-row .k{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.3px;}
  .item-detail-row .v{font-size:14px; font-weight:700;}
  .item-detail-row .v.total{color:var(--accent-deep);}
  .item-detail-row input.qty-input{width:76px; border:1px solid var(--ink); border-radius:8px; padding:7px 8px; text-align:right; font-size:14px; font-weight:700; font-family:'Inter';}
  .item-detail-actions{display:flex; gap:10px; margin-top:12px;}
  .item-detail-actions .btn{flex:1;}
  .order-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px; cursor:pointer;}
  .order-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .order-id{font-weight:700; font-size:15px;}
  .status{font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; white-space:nowrap;}
  .status-new{background:#FDEBD0; color:var(--accent-deep);}
  .status-processing{background:#E4ECE6; color:var(--transit);}
  .status-shipping{background:#DCE7F5; color:#2C5FA8;}
  .status-delivered{background:#EAE2F7; color:#6A3FB5;}
  .status-done{background:#DFF3E4; color:#2E7D46;}
  .status-cancelled{background:#F6DEDA; color:var(--danger);}
  .order-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 12px;}
  .order-row .k{display:block; font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.3px;}
  .order-row .v{display:block; font-size:13.5px; font-weight:600; margin-top:2px;}
  .order-open{margin-top:10px; font-size:12.5px; font-weight:700; color:var(--accent-deep);}
  .order-detail-head{background:var(--surface); border:none; box-shadow:0 1px 0 rgba(16,18,17,.05), 0 4px 12px rgba(16,18,17,.05); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
  .order-total-big{font-size:26px; font-weight:800; margin-bottom:14px; letter-spacing:-.3px;}
  .order-total-big span{font-size:15px; font-weight:600; color:var(--muted); margin-left:2px;}
  .order-detail-actions{display:flex; gap:8px; margin-top:14px;}
  .info-list{display:flex; flex-direction:column; gap:11px;}
  .info-row{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .info-row .k{font-size:12.5px; color:var(--muted); font-weight:500;}
  .info-row .v{font-size:13.5px; font-weight:700; text-align:right;}
  .flat{border:none !important; box-shadow:0 1px 0 rgba(16,18,17,.05), 0 4px 12px rgba(16,18,17,.05) !important;}
  .order-item-row{background:var(--surface); border:none; box-shadow:0 1px 0 rgba(16,18,17,.05), 0 4px 12px rgba(16,18,17,.05); border-radius:12px; padding:12px 14px; margin-bottom:8px;}
  .order-item-top{display:flex; align-items:flex-start; gap:10px;}
  .item-status{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px;}
  .item-status-pending{background:#F0EEE7; color:var(--muted);}
  .item-status-accepted{background:#DFF3E4; color:#2E7D46;}
  .item-status-rejected{background:#F6DEDA; color:var(--danger);}
  .admin-item-actions{display:flex; align-items:center; gap:8px;}
  .reason-box{margin-top:8px; display:flex; gap:6px;}
  .reason-box input{flex:1;}
  .template-card, .admin-list-item{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;}
  .template-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .template-title{font-weight:600; font-size:14.5px;}
  .template-use{border:none; background:var(--ink); color:#fff; font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:8px; cursor:pointer;}
  .bottomnav{position:sticky; bottom:0; z-index:10; display:flex; background:var(--surface); border-top:1px solid var(--border); padding:10px 6px calc(10px + env(safe-area-inset-bottom,0px));}
  .navbtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; color:var(--muted); font-family:'Inter'; font-size:10.5px; cursor:pointer; position:relative; padding:5px 0; border-radius:12px;}
  .navbtn svg{width:24px; height:24px;}
  .navbtn.active{color:var(--accent-deep); font-weight:700; background:rgba(255,81,3,0.08);}
  .badge{position:absolute; top:-3px; right:22%; background:var(--accent-deep); color:#fff; font-size:10px; font-weight:700; border-radius:10px; min-width:17px; height:17px; display:flex; align-items:center; justify-content:center; padding:0 4px;}
  .profile-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
  .profile-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:14px;}
  .profile-row:last-child{border-bottom:none;}
  .profile-row .k{color:var(--muted);}
  .profile-row .v{font-weight:600;}
  .stat-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .stat-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px;}
  .stat-label{font-size:11.5px; color:var(--muted);}
  .stat-value{font-size:20px; font-weight:700; margin-top:4px;}
  .menu-list{display:flex; flex-direction:column; gap:8px;}
  .menu-item{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px 14px; font-size:14px; font-weight:600; cursor:pointer;}
  .menu-item svg{flex:none;}
  .access-screen, .loading-screen{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:70vh; text-align:center; padding:30px;}
  .loading-spinner{width:42px; height:42px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--accent); animation:spin .8s linear infinite; margin-bottom:16px;}
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .mini-spinner{display:inline-block; width:14px; height:14px; border-radius:50%; border:2px solid rgba(0,0,0,.15); border-top-color:var(--accent); animation:spin .7s linear infinite; vertical-align:middle;}
  .access-screen .e{font-size:44px; margin-bottom:14px;}
  .access-screen p{color:var(--muted); font-size:14px; line-height:1.5; max-width:280px;}
  .icon-upload-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .icon-preview{width:52px;height:52px;border-radius:10px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:22px;flex:none;}
  .icon-preview img{width:100%;height:100%;object-fit:cover;}
  .upload-btn{border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:12.5px; font-weight:600; padding:9px 12px; border-radius:9px; cursor:pointer; display:flex; align-items:center; gap:6px;}
  .reorder-btns{display:flex; flex-direction:column; gap:4px;}
  .reorder-btn{width:38px; height:32px; border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;}
  .reorder-btn.reorder-up{transform:rotate(180deg);}
  .reorder-btn:disabled{opacity:.3; cursor:default;}
  .reorder-btn:active{background:var(--pill);}
  .row-between{display:flex; justify-content:space-between; align-items:center; gap:10px;}

const API_BASE = "https://yaqin-food-bot.onrender.com";

const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }
let INIT_DATA = tg ? (tg.initData || "") : "";
async function waitForInitData(maxWaitMs){
  const start = Date.now();
  while(!INIT_DATA && tg && (Date.now()-start) < maxWaitMs){
    await new Promise(r=>setTimeout(r,150));
    INIT_DATA = tg.initData || "";
  }
}

function notify(msg){ if (tg && tg.showAlert) tg.showAlert(msg); else alert(msg); }
function askConfirm(msg){
  return new Promise(resolve=>{
    if (tg && tg.showConfirm) tg.showConfirm(msg, ok=>resolve(ok));
    else resolve(confirm(msg));
  });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return Math.round(n||0).toLocaleString('ru-RU').replace(/,/g,' '); }
// для количества (кг/л/шт) — округлять НЕЛЬЗЯ, только убрать погрешности округления (1.5 остаётся 1.5, не 2)
function fmtQty(n){ return String(Math.round((n||0)*100)/100); }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit'});
}
function toDateStr(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function todayStr(){ return toDateStr(new Date()); }
function fmtDayLabel(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('ru-RU', {day:'2-digit', month:'long', weekday:'short'});
}
function shiftDateStr(dateStr, delta){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+delta);
  return toDateStr(d);
}
function orderLocalDateStr(iso){
  if(!iso) return '';
  return toDateStr(new Date(iso));
}
function deliveryDateOptions(){
  const out = [];
  for(let i=0;i<5;i++) out.push(shiftDateStr(todayStr(), i));
  return out;
}
function fmtDatePill(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const dow = d.toLocaleDateString('ru-RU', {weekday:'short'});
  return dow.charAt(0).toUpperCase()+dow.slice(1)+' '+d.getDate();
}
const TIME_SLOTS = (function(){ const a=[]; for(let h=8;h<=20;h++) a.push(String(h).padStart(2,'0')+':00'); return a; })();

async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json', 'X-Telegram-Init-Data': INIT_DATA}, opts.headers||{});
  const res = await fetch(API_BASE + path, Object.assign({}, opts, {headers}));
  if(!res.ok){
    const err = new Error('api_error'); err.status = res.status;
    try{ err.body = await res.json(); }catch(e){}
    throw err;
  }
  if(res.status === 204) return null;
  return res.json();
}

function t(ruText){
  if(state.lang === 'uz' && I18N_UZ.hasOwnProperty(ruText)) return I18N_UZ[ruText];
  return ruText;
}
async function setLang(lang){
  if(lang!=='ru' && lang!=='uz') return;
  state.lang = lang;
  localSet('lang', lang);
  render();
  try{ await api('/api/me/language', {method:'PATCH', body: JSON.stringify({language: lang})}); }catch(e){}
}

function saveLocal(){ localSet('cart', state.cart); localSet('favorites', state.favorites); }

function allProducts(){
  const out = [];
  function walk(list){
    list.forEach(c=>{
      (c.products||[]).forEach(p=>out.push(Object.assign({categoryId:c.id}, p)));
      if(c.subcategories && c.subcategories.length) walk(c.subcategories);
    });
  }
  walk(state.catalog);
  return out;
}
function findProduct(id){ return allProducts().find(p=>p.id===id); }
function findCategory(id){
  function search(list){
    for(const c of list){
      if(c.id===id) return c;
      if(c.subcategories && c.subcategories.length){ const r=search(c.subcategories); if(r) return r; }
    }
    return null;
  }
  return search(state.catalog);
}
// после render() возвращает фокус в поле формы (для быстрого добавления многих товаров подряд)
function focusFormField(formSelector, fieldName){
  const f = document.querySelector(formSelector);
  const el = f && f.querySelector('[name="'+fieldName+'"]');
  if(el) el.focus();
}

function cartTotalQty(){ return state.cart.reduce((s,i)=>s+i.qty,0); }
function cartTotalSum(){ return state.cart.reduce((s,i)=>s+i.qty*i.price,0); }
function cartQtyFor(name){ const it = state.cart.find(c=>c.name===name); return it?it.qty:0; }

function addToCart(p){
  let it = state.cart.find(c=>c.name===p.name);
  if(it){ it.qty += 1; if(!it.icon && p.icon) it.icon = p.icon; }
  else state.cart.push({name:p.name, unit:p.unit, price:p.price, icon:p.icon||'', qty:1});
  saveLocal();
}
function decFromCart(name){
  let it = state.cart.find(c=>c.name===name);
  if(!it) return;
  it.qty -= 1;
  if(it.qty<=0) state.cart = state.cart.filter(c=>c.name!==name);
  saveLocal();
}
function removeFromCart(name){ state.cart = state.cart.filter(c=>c.name!==name); saveLocal(); }
function setCartQty(p, qty){
  qty = Math.round((qty||0)*100)/100;
  let it = state.cart.find(c=>c.name===p.name);
  if(qty<=0){ state.cart = state.cart.filter(c=>c.name!==p.name); }
  else if(it){ it.qty = qty; }
  else { state.cart.push({name:p.name, unit:p.unit, price:p.price, icon:p.icon||'', qty}); }
  saveLocal();
}

function isFav(name){ return state.favorites.some(f=>f.name===name); }
function toggleFav(p){
  if(isFav(p.name)) state.favorites = state.favorites.filter(f=>f.name!==p.name);
  else state.favorites.push({name:p.name, unit:p.unit, price:p.price, icon:p.icon||''});
  saveLocal();
}

/* ---------- ICON RENDERING (emoji ИЛИ фото, загруженное админом) ---------- */
function isImageIcon(v){ return !!v && (v.indexOf('data:')===0 || v.indexOf('http')===0); }
function iconHTML(icon, size, fallback){
  const use = icon || fallback || '';
  if(isImageIcon(use)){
    return '<img src="'+use+'" loading="lazy" decoding="async" style="width:'+size+'px;height:'+size+'px;object-fit:cover;border-radius:9px;">';
  }
  return '<span style="font-size:'+size+'px;">'+esc(use||'📦')+'</span>';
}

/* ============================== BOOT ============================== */
async function boot(){
  render();
  await waitForInitData(3000);
  try{
    state.me = await api('/api/me');
    if(localGet('lang', null) === null && state.me && state.me.language){ state.lang = state.me.language; }
  }catch(e){
    state.authError = (e && e.status===403) ? 'no_access' : 'error';
    render();
    return;
  }
  try{ state.catalog = await api('/api/catalog'); }catch(e){}
  try{ state.orders = await api('/api/orders'); }catch(e){}
  state.ready = true;
  render();
}

async function refreshOrders(){ try{ state.orders = await api('/api/orders'); }catch(e){} }
async function refreshCatalog(){ try{ state.catalog = await api('/api/catalog'); }catch(e){} }

async function ensureClientsCache(){
  if(state.clientsCache) return;
  try{
    const all = await api('/api/admin/users');
    state.clientsCache = all.filter(u=>u.role!=='admin');
    if(!state.adminScopeUserId && state.clientsCache.length) state.adminScopeUserId = state.clientsCache[0].id;
  }catch(e){ state.clientsCache = []; }
}
function scopeUserParam(){
  const isAdmin = state.me && state.me.role==='admin';
  return (isAdmin && state.adminScopeUserId) ? ('&user_id='+state.adminScopeUserId) : '';
}
async function loadInvoices(){
  if(state.me && state.me.role==='admin'){
    await ensureClientsCache();
    if(!state.adminScopeUserId){ state.invoicesCache = []; return; }
    try{ state.invoicesCache = await api('/api/admin/invoices?user_id='+state.adminScopeUserId); }catch(e){ state.invoicesCache = []; }
  } else {
    try{ state.invoicesCache = await api('/api/invoices'); }catch(e){ state.invoicesCache = []; }
  }
}
async function loadPayments(){
  if(state.me && state.me.role==='admin'){
    await ensureClientsCache();
    if(!state.adminScopeUserId){ state.paymentsCache = []; return; }
    try{ state.paymentsCache = await api('/api/admin/payments?user_id='+state.adminScopeUserId); }catch(e){ state.paymentsCache = []; }
  } else {
    try{ state.paymentsCache = await api('/api/payments'); }catch(e){ state.paymentsCache = []; }
  }
}
async function loadMonitoring(){
  if(state.me && state.me.role==='admin'){
    await ensureClientsCache();
    if(!state.adminScopeUserId){ state.monitoringCache = null; return; }
  }
  try{ state.monitoringCache = await api('/api/monitoring?period='+(state.monitoringPeriod||'week')+scopeUserParam()); }catch(e){ state.monitoringCache = null; }
}
async function moveCategorySibling(siblings, catId, dir){
  const idx = siblings.findIndex(c=>c.id===catId);
  const swapIdx = idx + dir;
  if(idx<0 || swapIdx<0 || swapIdx>=siblings.length) return;
  const newOrder = siblings.slice();
  const tmp = newOrder[idx]; newOrder[idx] = newOrder[swapIdx]; newOrder[swapIdx] = tmp;
  try{
    // Перенумеровываем ВСЕХ соседей по порядку — иначе категории, у которых
    // sort_order ещё не задан явно (все новые = 0), «слипаются» и стрелочки
    // выглядят так, будто ничего не делают.
    for(let i=0;i<newOrder.length;i++){
      const c = newOrder[i];
      await api('/api/admin/categories/'+c.id, {method:'PATCH', body: JSON.stringify({name:c.name, icon:c.icon||'', sort_order:i})});
    }
    await refreshCatalog();
    render();
    notify(t('Порядок обновлён'));
  }catch(err){ notify(t('Не удалось изменить порядок')); }
}

async function moveProductSibling(siblings, prodId, dir){
  const idx = siblings.findIndex(p=>p.id===prodId);
  const swapIdx = idx + dir;
  if(idx<0 || swapIdx<0 || swapIdx>=siblings.length) return;
  const newOrder = siblings.slice();
  const tmp = newOrder[idx]; newOrder[idx] = newOrder[swapIdx]; newOrder[swapIdx] = tmp;
  try{
    // Как и для категорий: перенумеровываем всех соседей, иначе товары
    // с одинаковым (ещё не заданным) sort_order не переставляются местами.
    for(let i=0;i<newOrder.length;i++){
      const p = newOrder[i];
      await api('/api/admin/products/'+p.id, {method:'PATCH', body: JSON.stringify({
        category_id: state.adminCatId,
        name: p.name, unit: p.unit, price: p.price, old_price: p.old_price,
        icon: p.icon||'', in_stock: p.in_stock, sort_order: i
      })});
    }
    await refreshCatalog();
    render();
    notify(t('Порядок обновлён'));
  }catch(err){ notify(t('Не удалось изменить порядок')); }
}

function render(){
  try{ renderInner(); }
  catch(e){
    const c = document.getElementById('content');
    if(c) c.innerHTML = '<div class="access-screen"><div class="e">⚠️</div><h2>'+t('Что-то пошло не так')+'</h2><p>'+t('Попробуйте вернуться назад или открыть приложение заново.')+'</p><button class="back" data-back style="margin:16px auto 0;width:auto;padding:0 16px;">'+t('Назад')+'</button></div>';
  }
}
function renderInner(){
  document.querySelectorAll('.navbtn').forEach(b=>{
    b.innerHTML = ({catalog:ico('grid'), cart:'<span style="position:relative;display:inline-flex">'+ico('cart')+'<span class="badge" id="cart-badge" style="display:none"></span></span>', orders:ico('orders'), templates:ico('templates')}[b.dataset.tab]||'') + '<span>'+({catalog:t('Каталог'),cart:t('Корзина'),orders:t('Заказы'),templates:t('Шаблоны')}[b.dataset.tab]||'')+'</span>';
    b.classList.toggle('active', b.dataset.tab===state.tab && !state.overlay);
  });
  document.querySelectorAll('.topbar-icons .icon-btn')[0].innerHTML = ico('search',23);
  document.querySelectorAll('.topbar-icons .icon-btn')[1].innerHTML = (isFav(null)?'':'') + ico('heart',22) + '<span class="fav-badge" id="fav-badge" style="display:'+(state.favorites.length?'flex':'none')+'">'+state.favorites.length+'</span>';
  document.querySelectorAll('.topbar-icons .icon-btn')[2].innerHTML = ico('user',23);

  const c = document.getElementById('content');
  const bottomnav = document.getElementById('bottomnav');
  bottomnav.style.display = state.ready ? 'flex' : 'none';

  if(state.authError){ c.innerHTML = renderAccessError(); return; }
  if(!state.ready){ c.innerHTML = renderLoading(); return; }

  if(state.overlay==='search') c.innerHTML = renderSearch();
  else if(state.overlay==='favorites') c.innerHTML = renderFavorites();
  else if(state.overlay==='profile') c.innerHTML = renderProfile();
  else if(state.overlay==='orderDetail') c.innerHTML = renderOrderDetail();
  else if(state.overlay==='adminCatalog') c.innerHTML = renderAdminCatalog();
  else if(state.overlay==='adminCatalogCat') c.innerHTML = renderAdminCatalogCat();
  else if(state.overlay==='adminUsers') c.innerHTML = renderAdminUsers();
  else if(state.overlay==='adminStats') c.innerHTML = renderAdminStats();
  else if(state.overlay==='adminPromo') c.innerHTML = renderAdminPromo();
  else if(state.overlay==='invoices') c.innerHTML = renderInvoices();
  else if(state.overlay==='payments') c.innerHTML = renderPayments();
  else if(state.overlay==='monitoring') c.innerHTML = renderMonitoring();
  else if(state.overlay==='productDetail') c.innerHTML = renderProductDetail();
  else if(state.overlay==='checkoutDetails') c.innerHTML = renderCheckoutDetails();
  else if(state.tab==='catalog') c.innerHTML = state.view==='grid' ? renderCatalogGrid() : (state.view==='subcats' ? renderSubcatGrid() : renderCatalogDetail());
  else if(state.tab==='cart') c.innerHTML = renderCart();
  else if(state.tab==='orders') c.innerHTML = renderOrdersList();
  else if(state.tab==='templates') c.innerHTML = renderTemplates();

  updateCartBadge();
}

  const b = document.getElementById('cart-badge');

function renderCatalogGrid(){
  if(!state.catalog.length) return '<div class="empty"><span class="e-icon">📦</span>'+t('Каталог пока пуст');
  const tiles = state.catalog.map(cat=>
    '<div class="tile" data-open-cat="'+cat.id+'">'+
      '<div class="tile-icon">'+iconHTML(cat.icon, 26)+'</div>'+
      '<div class="tile-title">'+esc(cat.name)+'</div>'+
    '</div>'
  ).join('');
  return '<div class="grid">'+tiles+'</div>';
}
function renderSubcatGrid(){
  const cat = findCategory(state.parentCatId);
  if(!cat) return renderCatalogGrid();
  const subTiles = (cat.subcategories||[]).map(sc=>
    '<div class="tile" data-open-subcat="'+sc.id+'">'+
      '<div class="tile-icon">'+iconHTML(sc.icon, 26, cat.icon)+'</div>'+
      '<div class="tile-title">'+esc(sc.name)+'</div>'+
    '</div>'
  ).join('');
  const ownProducts = cat.products && cat.products.length
    ? '<div class="section-label">'+t('Другие товары')+'</div>'+productGridHTML(cat.products, cat)
    : '';
  return (
    '<div class="detail-head"><button class="back" data-back>'+ico('back',18)+'</button><h2>'+esc(cat.name)+'</h2></div>'+
    '<div class="grid">'+subTiles+'</div>'+
    ownProducts
  );
}
function qtyControlsHTML(p){
  const q = cartQtyFor(p.name);
  if(!p.in_stock) return '<div class="oos-label">'+t('Нет в наличии')+'</div>';
  if(q<=0) return '<button class="btn-add-tile" data-add-prod="'+p.id+'">+'+t(' Добавить')+'</button>';
  return '<div class="tile-qty"><button data-dec-prod="'+p.id+'">−</button>'+
    '<input type="number" inputmode="decimal" step="0.1" min="0" class="qty-input" data-qty-input="'+p.id+'" value="'+q+'">'+
    '<button data-add-prod="'+p.id+'">+</button></div>';
}
function discountPct(p){
  if(!p.old_price || p.old_price<=p.price) return 0;
  return Math.round((1 - p.price/p.old_price)*100);
}
function productGridHTML(products, cat){
  const tiles = products.map(p=>{
    try{
      const disc = discountPct(p);
      return '<div class="prod-tile'+(p.in_stock?'':' out-of-stock')+'">'+
        '<div class="prod-photo" data-open-product="'+p.id+'">'+iconHTML(p.icon, 30, cat.icon)+
          (disc>0 ? '<span class="discount-tag">'+ico('down',11)+' -'+disc+'%</span>' : '')+
          '<button class="fav-heart'+(isFav(p.name)?' active':'')+'" data-toggle-fav="'+esc(p.name)+'" data-toggle-fav-unit="'+esc(p.unit)+'" data-toggle-fav-price="'+p.price+'" data-toggle-fav-icon="'+esc(p.icon||cat.icon||'')+'" type="button">'+ico(isFav(p.name)?'heartFill':'heart',16)+'</button>'+
        '</div>'+
        '<div class="prod-name">'+esc(p.name)+'</div>'+
        '<div class="prod-price">'+fmt(p.price)+t(' сум')+(disc>0?' <span class="discount-badge">'+ico('down',10)+disc+'%</span>':'')+'<span class="prod-unit">/ '+esc(p.unit)+'</span></div>'+
        qtyControlsHTML(p)+
      '</div>';
    }catch(e){ return ''; }
  }).join('');
  return tiles.trim() ? '<div class="prod-grid">'+tiles+'</div>' : '<div class="empty">'+t('В этой категории пока нет товаров')+'</div>';
}

    productGridHTML(cat.products||[], cat)
  );

function renderProductDetail(){

  if(!p) return renderCatalogGrid();
  const cat = findCategory(p.categoryId);
  const disc = discountPct(p);
  return (
    '<div class="detail-head"><button class="back" data-back>'+ico('back',18)+'</button><h2>'+esc(p.name)+'</h2></div>'+

function searchResultsHTML(){

  if(!q) return '<div class="empty">'+t('Начните вводить название товара')+'</div>';
  const found = allProducts().filter(p=>p.name.toLowerCase().indexOf(q)!==-1);
  if(!found.length) return '<div class="empty">'+t('Ничего не найдено')+'</div>';
  return found.map(p=>
    '<div class="item-row"><div><div class="item-name">'+esc(p.name)+'</div><div class="item-price">'+fmt(p.price)+t(' сум / ')+esc(p.unit)+(p.in_stock?'':' ·'+t(' нет в наличии'))+'</div></div>'+
    (p.in_stock ? '<button class="btn btn-small btn-primary" data-add-prod="'+p.id+'">'+t('Добавить')+'</button>' : '')+
    '</div>'
  ).join('');
}

function renderCheckoutDetails(){
  if(!state.checkoutDate) state.checkoutDate = todayStr();
  const dateRow = deliveryDateOptions().map(d=>
    '<button class="date-pill'+(state.checkoutDate===d?' active':'')+'" data-checkout-date="'+d+'">'+fmtDatePill(d)+'</button>'

    '<button class="time-slot'+(state.checkoutTime===t?' active':'')+'" data-checkout-time="'+t+'">'+t+'</button>'
  ).join('');
  const subtotal = cartTotalSum();
  const promoOk = state.promoResult && state.promoResult.valid;
  const discount = promoOk ? (state.promoResult.discount_amount||0) : 0;

  const promoNote = state.promoResult
    ? (promoOk
        ? '<div class="muted-small" style="color:#2e7d32;">'+t('Промокод применён: ')+'−'+fmt(discount)+t(' сум')+'</div>'

    '<div class="detail-head"><button class="back" data-back>'+ico('back',18)+'</button><h2>'+t('Детали заказа')+'</h2></div>'+
    '<div class="checkout-details">'+

      '<div class="field"><label>'+t('Дата доставки')+'</label><div class="date-row">'+dateRow+'</div></div>'+
      '<div class="field"><label>'+t('Время доставки')+'</label><div class="time-grid">'+timeGrid+'</div></div>'+
      '<div class="field"><label>'+t('Промокод')+'</label><div style="display:flex;gap:8px;">'+
        '<input id="checkout-promo-input" placeholder="'+t('Введите промокод')+'" value="'+esc(state.promoCode||'')+'" style="flex:1;">'+
        '<button type="button" class="btn btn-ghost btn-small" data-apply-promo>'+t('Применить')+'</button>'+
      '</div>'+promoNote+'</div>'+
      '<div class="field" style="margin-bottom:0;"><label>'+t('Комментарий к заказу')+'</label>'+

      '</div>'+
    '</div>'+
    '<div class="total-bar">'+
      (discount>0 ? '<div class="total-row"><span>'+t('Подытог')+'</span><span>'+fmt(subtotal)+t(' сум')+'</span></div><div class="total-row"><span>'+t('Скидка')+'</span><span>−'+fmt(discount)+t(' сум')+'</span></div>' : '')+

function statusLabel(s){ return {new:t('Новый'), processing:t('В обработке'), shipping:t('Доставляется'), delivered:t('Доставлен'), done:t('Выполнен'), cancelled:t('Отменён')}[s]||s; }
function paymentLabel(pm){ return {cash:t('Наличные'), card:t('Карта'), credit:t('Перечисление')}[pm] || t('Не указан'); }
function renderOrdersList(){
  const isAdmin = state.me && state.me.role==='admin';
  if(!state.ordersDate) state.ordersDate = todayStr();
  const toggle =
    '<div class="orders-view-toggle">'+
      '<button class="ovt-btn'+(state.ordersView==='all'?' active':'')+'" data-orders-view="all">'+t('Все заказы')+'</button>'+
      '<button class="ovt-btn'+(state.ordersView==='day'?' active':'')+'" data-orders-view="day">'+ico('calendar',15)+t(' По дням')+'</button>'+
    '</div>';
  const dayNav = state.ordersView==='day'
    ? '<div class="orders-day-nav">'+
        '<button class="day-nav-btn" data-orders-day-prev>'+ico('back',15)+'</button>'+
        '<input type="date" class="day-nav-input" id="orders-date-input" value="'+state.ordersDate+'">'+
        '<button class="day-nav-btn" style="transform:rotate(180deg);" data-orders-day-next>'+ico('back',15)+'</button>'+
      '</div>'
    : '';
  let list = state.orders;
  if(state.ordersView==='day'){
    list = list.filter(o=>orderLocalDateStr(o.created_at)===state.ordersDate);
  }
  if(!list.length){
    return toggle + dayNav + '<div class="empty"><span class="e-icon">📋</span>'+(state.ordersView==='day'?t('В этот день заказов нет'):t('Заказов пока нет'))+'</div>';
  }
  const rows = list.map(o=>
    '<div class="order-card" data-open-order="'+o.id+'"><div class="order-top">'+
      '<div class="order-id">'+t('Заказ ')+'#'+o.id+(isAdmin? ' · '+esc(o.restaurant||'-') : '')+'</div>'+
      '<span class="status status-'+o.status+'">'+statusLabel(o.status)+'</span></div>'+
      '<div class="order-grid">'+
        '<div class="order-row"><span class="k">'+t('Позиция')+'</span><span class="v">'+esc(o.position||'-')+'</span></div>'+
        '<div class="order-row"><span class="k">'+t('Дата заказа')+'</span><span class="v">'+fmtDate(o.created_at)+'</span></div>'+
        '<div class="order-row"><span class="k">'+t('Кол-во товаров')+'</span><span class="v">'+o.items_count+'</span></div>'+
        '<div class="order-row"><span class="k">'+t('Итого')+'</span><span class="v">'+fmt(o.total)+t(' сум')+'</span></div>'+
      '</div><div class="order-open">'+t('Детали заказа ')+'→</div></div>'
  ).join('');
  return toggle + dayNav + rows;
}
function renderOrderDetail(){
  const o = state.orders.find(x=>x.id===state.orderDetailId);
  if(!o) return '<div class="empty">'+t('Заказ не найден')+'</div>';
  const isAdmin = state.me && state.me.role==='admin';
  const canCancel = !isAdmin && o.status==='new';
  const head =
    '<div class="detail-head"><button class="back" data-back>'+ico('back',18)+'</button><h2>'+t('Заказ ')+'#'+o.id+'</h2></div>'+
    '<div class="order-detail-head">'+
      (isAdmin ? '<div class="info-row" style="margin-bottom:12px;"><span class="k">'+t('Заведение')+'</span><span class="v">'+esc(o.restaurant||'-')+' · '+esc(o.user_name||'-')+'</span></div>' : '')+
      '<div class="status status-'+o.status+'" style="display:inline-flex;margin-bottom:12px;">'+statusLabel(o.status)+'</div>'+
      '<div class="order-total-big">'+fmt(o.total)+' <span>'+t('сум')+'</span></div>'+
      '<div class="info-list">'+
        '<div class="info-row"><span class="k">'+t('ID заказа')+'</span><span class="v">#'+o.id+'</span></div>'+
        '<div class="info-row"><span class="k">'+t('Способ оплаты')+'</span><span class="v">'+paymentLabel(o.payment_method)+'</span></div>'+
        '<div class="info-row"><span class="k">'+t('Позиция')+'</span><span class="v">'+esc(o.position||'-')+'</span></div>'+
        '<div class="info-row"><span class="k">'+t('Дата заказа')+'</span><span class="v">'+fmtDate(o.created_at)+'</span></div>'+
        '<div class="info-row"><span class="k">'+t('Время доставки')+'</span><span class="v">'+(o.delivery_time?fmtDate(o.delivery_time):t('не назначено'))+'</span></div>'+
        '<div class="info-row"><span class="k">'+t('Количество товаров')+'</span><span class="v">'+o.items_count+'</span></div>'+
        ((o.discount_amount||0)>0 ? '<div class="info-row"><span class="k">'+t('Подытог')+'</span><span class="v">'+fmt(o.subtotal)+t(' сум')+'</span></div>'+
          '<div class="info-row"><span class="k">'+t('Промокод')+'</span><span class="v">'+esc(o.promo_code||'-')+' (−'+fmt(o.discount_amount)+t(' сум)')+'</span></div>' : '')+
      '</div>'+
      (isAdmin ? '<div class="divider"></div><div class="field" style="margin:0;"><label>'+t('Статус заказа')+'</label>'+
        '<select data-order-status-select="'+o.id+'">'+
          ['cancelled','new','processing','shipping','delivered','done'].map(s=>'<option value="'+s+'"'+(s===o.status?' selected':'')+'>'+statusLabel(s)+'</option>').join('')+
        '</select></div>' : '')+
      '<div class="order-detail-actions">'+
        (o.status==='new' ? '<button class="btn btn-ghost btn-small" style="flex:1;" data-open-add-item="'+o.id+'">'+ico('plus',15)+t(' Добавить товар')+'</button>' : '')+
        (canCancel ? '<button class="btn btn-danger btn-small" style="flex:1;" data-cancel-order="'+o.id+'">'+ico('close',15)+t(' Отменить заказ')+'</button>' : '')+
        '<button class="btn btn-ghost btn-small" style="flex:1;" data-repeat-order="'+o.id+'">'+ico('cart',15)+t(' Повторить заказ')+'</button>'+
      '</div>'+
      (state.addItemOrderId===o.id && o.status==='new' ?
        '<div class="admin-list-item flat" style="margin-top:10px;">'+
          '<div class="field"><label>'+t('Товар')+'</label><select id="add-item-product">'+
            allProducts().map(p=>'<option value="'+p.id+'">'+esc(p.name)+' — '+fmt(p.price)+t(' сум/')+esc(p.unit)+'</option>').join('')+
          '</select></div>'+
          '<div class="field" style="margin-bottom:0;"><label>'+t('Количество')+'</label><input type="number" inputmode="decimal" step="0.1" min="0.1" id="add-item-qty" value="1"></div>'+
          '<button class="btn btn-primary" style="margin-top:10px;" data-confirm-add-item="'+o.id+'">'+t('Добавить в заказ')+'</button>'+
        '</div>' : '')+
    '</div>'+
    (o.status==='new' ?
      '<div class="admin-list-item flat">'+
        '<div class="field" style="margin-bottom:8px;"><label>'+t('Комментарий к заказу')+'</label>'+
          '<textarea rows="3" id="order-comment-input" placeholder="'+t('Оставьте комментарий к заказу')+'">'+esc(o.comment||'')+'</textarea>'+
        '</div>'+
        '<button class="btn btn-ghost" data-save-order-comment="'+o.id+'">'+t('Обновить')+'</button>'+
      '</div>'
      : (o.comment ? '<div class="admin-list-item flat"><div class="field" style="margin-bottom:0;"><label>'+t('Комментарий к заказу')+'</label>'+
          '<div style="font-size:14px;">'+esc(o.comment)+'</div></div></div>' : '')
    );
  const canActOnItems = isAdmin || o.status==='delivered';
  const items = o.items.map(i=>{
    const canEditDelivered = i.status==='pending' && o.status==='delivered';
    const canEditPrice = i.status==='pending' && isAdmin;
    const deliveredVal = (i.delivered_qty!=null ? i.delivered_qty : i.qty);
    const totalQty = canEditDelivered ? deliveredVal : (i.delivered_qty!=null ? i.delivered_qty : i.qty);
    const totalVal = totalQty * i.price;

    const priceRow = '<div class="item-detail-row"><span class="k">'+t('Цена')+'</span><span class="v">'+
      (canEditPrice
        ? '<input type="number" inputmode="decimal" step="1" min="0" class="qty-input" id="price-input-'+i.id+'" value="'+i.price+'" data-item-calc="'+i.id+'">'
        : fmt(i.price)+t(' сум'))
      +'</span></div>';
    const orderedRow = '<div class="item-detail-row"><span class="k">'+t('Заказанное количество')+'</span><span class="v">'+i.qty+' '+esc(i.unit)+'</span></div>';
    const deliveredRow = (i.status!=='rejected') ? '<div class="item-detail-row"><span class="k">'+t('Доставленное количество')+'</span><span class="v">'+
      (canEditDelivered
        ? '<input type="number" inputmode="decimal" step="0.1" min="0" class="qty-input" id="delivered-input-'+i.id+'" value="'+deliveredVal+'" data-item-calc="'+i.id+'">'
        : fmtQty(totalQty)+' '+esc(i.unit))
      +'</span></div>' : '';
    const totalRow = (i.status!=='rejected') ? '<div class="item-detail-row"><span class="k">'+t('Итого')+'</span><span class="v total" id="itog-'+i.id+'" data-price="'+i.price+'" data-qty="'+totalQty+'">'+fmt(totalVal)+t(' сум')+'</span></div>' : '';

    let actionsRow = '';
    let rejectExtra = '';
    let note = '';
    if(i.status==='pending' && canActOnItems){
      const rejectBtn = isAdmin
        ? '<button class="btn btn-danger" data-item-reject-open="'+o.id+':'+i.id+'">'+t('Отказаться')+'</button>'
        : '<button class="btn btn-danger" data-item-reject-direct="'+o.id+':'+i.id+'">'+t('Отказаться')+'</button>';
      actionsRow = '<div class="item-detail-actions">'+rejectBtn+
        '<button class="btn btn-primary" data-item-accept="'+o.id+':'+i.id+'">'+t('Принять')+'</button>'+
        '</div>';
      if(isAdmin){
        rejectExtra = '<div class="reason-box" id="reason-box-'+i.id+'" style="display:none;">'+
            '<input placeholder="'+t('Причина (например: нет на складе)')+'" id="reason-input-'+i.id+'">'+
            '<button class="btn btn-small btn-danger" data-item-reject-confirm="'+o.id+':'+i.id+'">'+t('ОК')+'</button>'+
          '</div>';
      }
    } else if(i.status==='rejected'){
      note = '<div class="muted-small">'+t('Причина: ')+esc(i.reject_reason||'—')+'</div>';
    }
    return '<div class="order-item-row">'+
      '<div class="order-item-top">'+
        '<div class="order-item-photo">'+iconHTML(i.icon, 28, '')+'</div>'+
        '<div class="order-item-info"><div class="item-name">'+esc(i.product_name)+'</div>'+
          '<span class="item-status item-status-'+i.status+'">'+({pending:t('Ожидает'),accepted:t('Принято'),rejected:t('Отменено')}[i.status])+'</span>'+
        '</div>'+
      '</div>'+
      priceRow+orderedRow+deliveredRow+totalRow+
      actionsRow+rejectExtra+note+
    '</div>';
  }).join('');
  return head + items;
}

      : (isAdmin && inv.remaining_amount>0 ? '<button class="btn btn-ghost btn-small" style="margin-top:10px;" data-open-pay-invoice="'+inv.id+'">'+t('Отметить оплату')+'</button>' : '');

      '<div class="row-between" style="margin-bottom:10px;"><span class="status '+(inv.status==='paid'?'status-done':'status-new')+'">'+(inv.status==='paid'?t('Оплачен'):t('В ожидании'))+'</span></div>'+

        '<div class="info-row"><span class="k">'+t('ID заказа')+'</span><span class="v">#'+inv.order_id+'</span></div>'+
        '<div class="info-row"><span class="k">'+t('Дата инвойса')+'</span><span class="v">'+fmtDate(inv.created_at)+'</span></div>'+

/* ---------- МОНИТОРИНГ ---------- */
const MONITORING_PALETTE = ['#FF5103','#3F7D58','#2F6FED','#D8440A','#F2B705','#8E44AD','#16A085','#6B6E6A'];
function renderMonitoring(){
  const me = state.me || {};
  const isAdmin = me.role==='admin';
  if(isAdmin && !(state.clientsCache||[]).length){
    return '<div class="detail-head"><button class="back" data-back>'+ico('back',18)+'</button><h2>'+t('Мониторинг')+'</h2></div>'+clientPickerHTML();
  }
  const period = state.monitoringPeriod || 'week';
  const periodBtns = ['week','month','all'].map(p=>
    '<button class="ovt-btn'+(period===p?' active':'')+'" data-monitoring-period="'+p+'">'+({week:t('За неделю'),month:t('За месяц'),all:t('Весь период')}[p])+'</button>'
  ).join('');
  const head = '<div class="detail-head"><button class="back" data-back>'+ico('back',18)+'</button><h2>'+t('Мониторинг')+'</h2></div>'+clientPickerHTML()+'<div class="orders-view-toggle">'+periodBtns+'</div>';
  const m = state.monitoringCache;
  if(!m) return head + '<div class="empty">'+t('Загрузка')+'…</div>';

  const changeHTML = m.change_pct==null ? '' :
    '<span style="font-size:12px;margin-left:6px;color:'+(m.change_pct>=0?'var(--transit)':'var(--danger)')+';">'+(m.change_pct>=0?'▲':'▼')+' '+Math.abs(m.change_pct)+'%</span>';

  const slices = m.category_breakdown||[];
  let acc = 0;
  const gradientParts = slices.map((s,idx)=>{
    const start = acc; acc += s.pct;
    return MONITORING_PALETTE[idx%MONITORING_PALETTE.length]+' '+start+'% '+acc+'%';
  }).join(', ');
  const pieHTML = slices.length ?
    '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;">'+
      '<div style="width:130px;height:130px;border-radius:50%;background:conic-gradient('+gradientParts+');flex-shrink:0;"></div>'+
      '<div style="flex:1;min-width:150px;">'+slices.map((s,idx)=>
        '<div class="info-row"><span class="k"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+MONITORING_PALETTE[idx%MONITORING_PALETTE.length]+';margin-right:6px;"></span>'+esc(s.name)+'</span><span class="v">'+s.pct+'%</span></div>'
      ).join('')+'</div>'+
    '</div>' : '<div class="muted-small">'+t('Нет данных за период')+'</div>';

  const daily = m.daily_series||[];
  const maxDaily = Math.max(1, ...daily.map(d=>d.amount));
  const barsHTML = daily.length ?
    '<div style="display:flex;align-items:flex-end;gap:8px;height:130px;overflow-x:auto;padding-top:10px;">'+
      daily.map(d=>
        '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:26px;flex-shrink:0;">'+
          '<div style="width:18px;background:var(--accent);border-radius:4px 4px 0 0;height:'+Math.max(4,Math.round(d.amount/maxDaily*100))+'px;" title="'+fmt(d.amount)+t(' сум')+'"></div>'+
          '<div style="font-size:9px;color:var(--muted);">'+d.date.slice(5)+'</div>'+
        '</div>'
      ).join('')+
    '</div>' : '<div class="muted-small">'+t('Нет данных за период')+'</div>';

  const activeTab = state.monitoringTab || 'cat';
  return head+
    '<div class="stat-row"><div class="stat-card"><div class="stat-label">'+t('Закупки')+'</div><div class="stat-value">'+fmt(m.total_purchases)+' <span style="font-size:12px;">'+t('сум')+'</span></div>'+changeHTML+'</div>'+
    '<div class="stat-card"><div class="stat-label">'+t('Средняя закупка')+'</div><div class="stat-value">'+fmt(m.avg_purchase)+' <span style="font-size:12px;">'+t('сум')+'</span></div></div></div>'+
    '<div class="section-label">'+t('Пропорция оплаты')+'</div>'+
    '<div class="admin-list-item flat"><div class="info-list">'+
      '<div class="info-row"><span class="k">'+t('Наличные')+'</span><span class="v">'+m.cash_pct+'%</span></div>'+
      '<div class="info-row"><span class="k">'+t('Карта')+'</span><span class="v">'+m.card_pct+'%</span></div>'+
      (m.credit_pct>0 ? '<div class="info-row"><span class="k">'+t('Кредит')+'</span><span class="v">'+m.credit_pct+'%</span></div>' : '')+
    '</div></div>'+
    '<div class="stat-row"><div class="stat-card"><div class="stat-label">'+t('Оплачено')+'</div><div class="stat-value" style="color:var(--transit);font-size:18px;">'+fmt(m.paid_total)+'</div></div>'+
    '<div class="stat-card"><div class="stat-label">'+t('Осталось оплатить')+'</div><div class="stat-value" style="color:var(--danger);font-size:18px;">'+fmt(m.remaining_total)+'</div></div></div>'+
    '<div class="admin-list-item flat row-between"><div><div class="cart-card-meta">'+t('Активные инвойсы')+'</div><div class="template-title">'+m.active_invoices+'</div></div>'+
      '<button class="btn btn-small btn-ghost" data-open-overlay="invoices">'+t('Подробнее')+'</button></div>'+
    '<div class="orders-view-toggle" style="margin-top:14px;">'+
      '<button class="ovt-btn'+(activeTab==='cat'?' active':'')+'" data-monitoring-tab="cat">'+t('Категории закупок')+'</button>'+
      '<button class="ovt-btn'+(activeTab==='dyn'?' active':'')+'" data-monitoring-tab="dyn">'+t('Динамика закупок')+'</button>'+
    '</div>'+
    '<div class="admin-list-item flat">'+(activeTab==='cat' ? pieHTML : barsHTML)+'</div>';
}

/* ============================== ДЕЙСТВИЯ ============================== */
function goBack(){
  if(state.overlay==='adminCatalogCat'){
    if(state.adminParentCatId){ state.adminCatId = state.adminParentCatId; state.adminParentCatId = null; render(); return; }
    state.overlay='adminCatalog'; state.adminCatId=null; render(); return;
  }
  if(state.overlay==='productDetail'){ state.overlay=null; state.productDetailId=null; render(); return; }
  if(state.overlay){ state.overlay=null; state.orderDetailId=null; render(); return; }
  if(state.tab==='catalog' && state.view==='detail'){
    if(state.parentCatId){ state.view='subcats'; state.detailCatId=null; render(); return; }
    state.view='grid'; state.detailCatId=null; render(); return;
  }
  if(state.tab==='catalog' && state.view==='subcats'){ state.view='grid'; state.parentCatId=null; render(); return; }
}

let checkoutInProgress = false;
async function doCheckout(){
  if(!state.cart.length || checkoutInProgress) return;
  checkoutInProgress = true;
  const btn = document.querySelector('[data-checkout]');
  if(btn){ btn.disabled = true; btn.textContent = t('Оформляем')+'…'; }
  const paymentEl = document.getElementById('checkout-payment');
  const commentEl = document.getElementById('checkout-comment');
  let deliveryTime = null;
  if(state.checkoutDate && state.checkoutTime){
    deliveryTime = state.checkoutDate+'T'+state.checkoutTime+':00';
  }
  const promoOk = state.promoResult && state.promoResult.valid;
  try{
    await api('/api/orders', {method:'POST', body: JSON.stringify({
      items: state.cart.map(i=>({name:i.name, unit:i.unit, qty:i.qty, price:i.price, icon:i.icon||''})),
      payment_method: paymentEl ? paymentEl.value : '',
      comment: commentEl ? commentEl.value : '',
      delivery_time: deliveryTime,
      promo_code: promoOk ? state.promoResult.code : null
    })});
    state.cart = [];
    state.checkoutDate = null; state.checkoutTime = null;
    state.promoCode = null; state.promoResult = null;
    saveLocal();
    await refreshOrders();
    state.tab = 'orders'; state.overlay = null;
    notify(t('Заказ оформлен! Мы уведомили менеджера.'));
    render();
  }catch(e){
    const code = e && e.body && e.body.detail;
    if(code==='insufficient_credit'){
      notify(t('Недостаточно кредитного лимита для оплаты ')+'«'+t('Перечислением')+'»'+t('. Выберите другой способ оплаты или обратитесь к менеджеру.'));
    } else {
      notify(t('Не удалось оформить заказ. Попробуйте ещё раз.'));
    }
    if(btn){ btn.disabled = false; btn.textContent = t('Заказать'); }
  }finally{
    checkoutInProgress = false;
  }
}

const contentEl = document.getElementById('content');
const bottomnavEl = document.getElementById('bottomnav');
const appEl = document.getElementById('app');

appEl.addEventListener('click', async (e)=>{
  let el;
  if(el = e.target.closest('[data-set-lang]')){ await setLang(el.dataset.setLang); return; }
  if(el = e.target.closest('[data-tab]')){ state.tab = el.dataset.tab; state.view='grid'; state.parentCatId=null; state.detailCatId=null; state.overlay=null; render(); return; }
  if(el = e.target.closest('[data-go-home]')){ state.tab='catalog'; state.view='grid'; state.parentCatId=null; state.detailCatId=null; state.overlay=null; render(); return; }
  if(el = e.target.closest('[data-orders-view]')){ state.ordersView = el.dataset.ordersView; if(state.ordersView==='day' && !state.ordersDate) state.ordersDate = todayStr(); render(); return; }
  if(el = e.target.closest('[data-orders-day-prev]')){ state.ordersDate = shiftDateStr(state.ordersDate||todayStr(), -1); render(); return; }
  if(el = e.target.closest('[data-orders-day-next]')){ state.ordersDate = shiftDateStr(state.ordersDate||todayStr(), 1); render(); return; }
  if(el = e.target.closest('[data-open-overlay]')){

    if(state.overlay==='search') state.searchQuery='';
    if(state.overlay==='adminUsers'){ try{ adminUsersCache = await api('/api/admin/users'); }catch(err){ notify(t('Не удалось загрузить пользователей')); } }
    if(state.overlay==='adminStats'){ try{ state.adminStatsCache = await api('/api/admin/stats'); }catch(err){ notify(t('Не удалось загрузить статистику')); } }
    if(state.overlay==='adminPromo'){ try{ state.adminPromoCache = await api('/api/admin/promocodes'); }catch(err){ notify(t('Не удалось загрузить промокоды')); } }
    if(state.overlay==='invoices'){ state.payingInvoiceId = null; await loadInvoices(); }
    if(state.overlay==='payments'){ await loadPayments(); }
    if(state.overlay==='monitoring'){ await loadMonitoring(); }
    render();
    return;
  }
  if(el = e.target.closest('[data-back]')){ goBack(); return; }
  if(el = e.target.closest('[data-open-cat]')){
    const cat = findCategory(+el.dataset.openCat);
    if(cat && cat.subcategories && cat.subcategories.length){ state.parentCatId = cat.id; state.view='subcats'; }
    else { state.detailCatId = +el.dataset.openCat; state.view='detail'; }
    state.overlay=null; render(); return;
  }
  if(el = e.target.closest('[data-open-subcat]')){ state.detailCatId = +el.dataset.openSubcat; state.view='detail'; state.overlay=null; render(); return; }
  if(el = e.target.closest('[data-toggle-fav]')){
    const name = el.dataset.toggleFav;
    const p = { name, unit: el.dataset.toggleFavUnit||'', price: +el.dataset.toggleFavPrice||0, icon: el.dataset.toggleFavIcon||'' };
    toggleFav(p); saveLocal(); render(); return;
  }
  if(el = e.target.closest('[data-open-product]')){ state.productDetailId = +el.dataset.openProduct; state.overlay='productDetail'; render(); return; }

  if(el = e.target.closest('[data-add-prod]')){
    const p = findProduct(+el.dataset.addProd); if(p) addToCart(p);
    if(state.overlay==='search'){ document.getElementById('search-results').innerHTML = searchResultsHTML(); updateCartBadge(); }
    else render();
    return;
  }
  if(el = e.target.closest('[data-dec-prod]')){
    const p = findProduct(+el.dataset.decProd); if(p) decFromCart(p.name); render(); return;
  }
  if(el = e.target.closest('[data-cart-inc]')){ addToCart({name:el.dataset.cartInc, unit:'', price:0}); const it=state.cart.find(c=>c.name===el.dataset.cartInc); render(); return; }
  if(el = e.target.closest('[data-cart-dec]')){ decFromCart(el.dataset.cartDec); render(); return; }
  if(el = e.target.closest('[data-cart-remove]')){ removeFromCart(el.dataset.cartRemove); render(); return; }
  if(el = e.target.closest('[data-open-checkout]')){ state.overlay='checkoutDetails'; render(); return; }
  if(el = e.target.closest('[data-checkout]')){ doCheckout(); return; }
  if(el = e.target.closest('[data-goto-catalog]')){ state.tab='catalog'; state.view='grid'; render(); return; }
  if(el = e.target.closest('[data-checkout-date]')){ state.checkoutDate = el.dataset.checkoutDate; render(); return; }
  if(el = e.target.closest('[data-checkout-time]')){ state.checkoutTime = el.dataset.checkoutTime; render(); return; }

  if(el = e.target.closest('[data-add-fav]')){
    const f = state.favorites.find(x=>x.name===el.dataset.addFav);
    if(f) addToCart(f);
    render(); return;
  }
  if(el = e.target.closest('[data-remove-fav]')){ state.favorites = state.favorites.filter(f=>f.name!==el.dataset.removeFav); saveLocal(); render(); return; }

  if(el = e.target.closest('[data-open-order]')){
    state.orderDetailId = +el.dataset.openOrder; state.overlay='orderDetail'; state.addItemOrderId=null; render(); return;
  }
  if(el = e.target.closest('[data-open-add-item]')){
    const oid = +el.dataset.openAddItem;
    state.addItemOrderId = (state.addItemOrderId===oid) ? null : oid;
    render(); return;
  }
  if(el = e.target.closest('[data-confirm-add-item]')){
    const oid = +el.dataset.confirmAddItem;
    const selEl = document.getElementById('add-item-product');
    const qtyEl = document.getElementById('add-item-qty');
    const p = selEl ? findProduct(+selEl.value) : null;
    const qty = qtyEl ? parseFloat(qtyEl.value) : NaN;
    if(!p || isNaN(qty) || qty<=0){ notify(t('Выберите товар и укажите количество')); return; }
    try{
      const o = await api('/api/orders/'+oid+'/items', {method:'POST', body: JSON.stringify({name:p.name, unit:p.unit, qty, price:p.price, icon:p.icon||''})});
      state.orders = state.orders.map(x=>x.id===o.id?o:x);
      state.addItemOrderId = null;
      notify(t('Товар добавлен в заказ'));
      render();
    }catch(err){ notify(t('Не удалось добавить товар')); }
    return;
  }
  if(el = e.target.closest('[data-cancel-order]')){
    const oid = +el.dataset.cancelOrder;
    try{
      const o = await api('/api/orders/'+oid+'/status', {method:'PATCH', body: JSON.stringify({status:'cancelled'})});
      state.orders = state.orders.map(x=>x.id===o.id?o:x);
      notify(t('Заказ отменён'));
      render();
    }catch(err){ notify(t('Не удалось отменить заказ')); }
    return;
  }
  if(el = e.target.closest('[data-save-order-comment]')){
    const oid = +el.dataset.saveOrderComment;
    const val = document.getElementById('order-comment-input');
    try{
      const o = await api('/api/orders/'+oid, {method:'PATCH', body: JSON.stringify({comment: val?val.value:''})});
      state.orders = state.orders.map(x=>x.id===o.id?o:x);
      notify(t('Комментарий сохранён'));
      render();
    }catch(err){ notify(t('Не удалось сохранить')); }
    return;
  }
  if(el = e.target.closest('[data-item-accept]')){
    const [oid,iid] = el.dataset.itemAccept.split(':').map(Number);
    const body = {status:'accepted'};
    const qtyEl = document.getElementById('delivered-input-'+iid);
    if(qtyEl){
      const q = parseFloat(qtyEl.value);
      if(!isNaN(q) && q>=0) body.delivered_qty = q;
    }
    const priceEl = document.getElementById('price-input-'+iid);
    if(priceEl){
      const pr = parseFloat(priceEl.value);
      if(!isNaN(pr) && pr>=0) body.price = pr;
    }
    try{ const o = await api('/api/orders/'+oid+'/items/'+iid, {method:'PATCH', body: JSON.stringify(body)});
      state.orders = state.orders.map(x=>x.id===o.id?o:x); render(); }catch(err){ notify(t('Ошибка')); }
    return;
  }
  if(el = e.target.closest('[data-item-reject-open]')){
    const iid = el.dataset.itemRejectOpen.split(':')[1];
    const box = document.getElementById('reason-box-'+iid);
    if(box) box.style.display='flex';
    return;
  }
  if(el = e.target.closest('[data-item-reject-confirm]')){
    const [oid,iid] = el.dataset.itemRejectConfirm.split(':').map(Number);
    const input = document.getElementById('reason-input-'+iid);
    const reason = (input && input.value.trim()) || t('Нет в наличии');
    try{ const o = await api('/api/orders/'+oid+'/items/'+iid, {method:'PATCH', body: JSON.stringify({status:'rejected', reject_reason:reason})});
      state.orders = state.orders.map(x=>x.id===o.id?o:x); render(); }catch(err){ notify(t('Ошибка')); }
    return;
  }
  if(el = e.target.closest('[data-item-reject-direct]')){
    const [oid,iid] = el.dataset.itemRejectDirect.split(':').map(Number);
    try{ const o = await api('/api/orders/'+oid+'/items/'+iid, {method:'PATCH', body: JSON.stringify({status:'rejected'})});
      state.orders = state.orders.map(x=>x.id===o.id?o:x); render(); }catch(err){ notify(t('Ошибка')); }
    return;
  }
  if(el = e.target.closest('[data-save-delivered]')){
    const [oid,iid] = el.dataset.saveDelivered.split(':').map(Number);
    const input = document.getElementById('delivered-input-'+iid);
    const qty = input ? parseFloat(input.value) : NaN;
    if(isNaN(qty) || qty<0){ notify(t('Введите корректное количество')); return; }
    try{
      const o = await api('/api/orders/'+oid+'/items/'+iid, {method:'PATCH', body: JSON.stringify({delivered_qty: qty})});
      state.orders = state.orders.map(x=>x.id===o.id?o:x);
      notify(t('Количество обновлено'));
      render();
    }catch(err){ notify(t('Не удалось сохранить')); }
