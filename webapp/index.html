  if(el = e.target.closest('[data-open-admin-cat]')){ state.adminCatId = +el.dataset.openAdminCat; state.adminParentCatId = null; state.overlay='adminCatalogCat'; render(); return; }
  if(el = e.target.closest('[data-open-admin-subcat]')){ state.adminParentCatId = +el.dataset.parentCat; state.adminCatId = +el.dataset.openAdminSubcat; state.overlay='adminCatalogCat'; render(); return; }
  if(el = e.target.closest('[data-cat-up]')){ await moveCategorySibling(state.catalog, +el.dataset.catUp, -1); return; }
  if(el = e.target.closest('[data-cat-down]')){ await moveCategorySibling(state.catalog, +el.dataset.catDown, 1); return; }
  if(el = e.target.closest('[data-subcat-up]')){
    const parent = findCategory(state.adminCatId);
    if(parent) await moveCategorySibling(parent.subcategories||[], +el.dataset.subcatUp, -1);
    return;
  }
  if(el = e.target.closest('[data-subcat-down]')){
    const parent = findCategory(state.adminCatId);
    if(parent) await moveCategorySibling(parent.subcategories||[], +el.dataset.subcatDown, 1);
    return;
  }
  if(el = e.target.closest('[data-prod-up]')){
    const cat = findCategory(state.adminCatId);
    if(cat) await moveProductSibling(cat.products||[], +el.dataset.prodUp, -1);
    return;
  }
  if(el = e.target.closest('[data-prod-down]')){
    const cat = findCategory(state.adminCatId);
    if(cat) await moveProductSibling(cat.products||[], +el.dataset.prodDown, 1);
    return;
  }
  if(el = e.target.closest('[data-admin-del-cat]')){
    if(!await askConfirm(t('Удалить категорию вместе со всеми товарами в ней?'))) return;
    try{ await api('/api/admin/categories/'+el.dataset.adminDelCat, {method:'DELETE'}); await refreshCatalog(); render(); }catch(err){ notify(t('Ошибка')); }
    return;
  }
  if(el = e.target.closest('[data-admin-del-prod]')){
    if(!await askConfirm(t('Удалить товар?'))) return;
    try{ await api('/api/admin/products/'+el.dataset.adminDelProd, {method:'DELETE'}); await refreshCatalog(); render(); }catch(err){ notify(t('Ошибка')); }
    return;
  }
  if(el = e.target.closest('[data-admin-del-promo]')){
    if(!await askConfirm(t('Удалить промокод?'))) return;
    try{ await api('/api/admin/promocodes/'+el.dataset.adminDelPromo, {method:'DELETE'}); state.adminPromoCache = await api('/api/admin/promocodes'); render(); }catch(err){ notify(t('Ошибка')); }
    return;
  }
  if(el = e.target.closest('[data-admin-del-user]')){
    if(!await askConfirm(t('Убрать доступ у этого пользователя?'))) return;
    try{ await api('/api/admin/users/'+el.dataset.adminDelUser, {method:'DELETE'}); adminUsersCache = await api('/api/admin/users'); render(); }catch(err){ notify(t('Ошибка')); }
    return;
  }

  if(el = e.target.closest('[data-rename-cat]')){ state.renamingCatId = +el.dataset.renameCat; render(); return; }
  if(el = e.target.closest('[data-cancel-rename]')){ state.renamingCatId = null; render(); return; }

  if(el = e.target.closest('[data-export-orders]')){
    const url = API_BASE + '/api/admin/orders/export?init_data=' + encodeURIComponent(INIT_DATA);
    if(tg && tg.openLink) tg.openLink(url); else window.open(url, '_blank');
    return;
  }

  if(el = e.target.closest('[data-repeat-order]')){
    const o = state.orders.find(x=>x.id===+el.dataset.repeatOrder);
    if(o){
      o.items.forEach(i=>addToCart({name:i.product_name, unit:i.unit, price:i.price, icon:i.icon||''}));
      saveLocal();
      state.tab = 'cart'; state.overlay = null; state.orderDetailId = null;
      notify(t('Товары добавлены в корзину'));
      render();
    }
    return;
  }

  if(el = e.target.closest('[data-monitoring-period]')){
    state.monitoringPeriod = el.dataset.monitoringPeriod;
    await loadMonitoring(); render(); return;
  }
  if(el = e.target.closest('[data-monitoring-tab]')){
    state.monitoringTab = el.dataset.monitoringTab; render(); return;
  }
  if(el = e.target.closest('[data-open-pay-invoice]')){
    state.payingInvoiceId = +el.dataset.openPayInvoice; render(); return;
  }
  if(el = e.target.closest('[data-confirm-payment]')){
    const invId = +el.dataset.confirmPayment;
    const amountEl = document.getElementById('pay-amount-'+invId);
    const methodEl = document.getElementById('pay-method-'+invId);
    const commentEl = document.getElementById('pay-comment-'+invId);
    const amount = amountEl ? parseFloat(amountEl.value) : NaN;
    if(!state.adminScopeUserId){ notify(t('Выберите заведение')); return; }
    if(isNaN(amount) || amount<=0){ notify(t('Введите корректную сумму')); return; }
    try{
      await api('/api/admin/payments', {method:'POST', body: JSON.stringify({
        user_id: state.adminScopeUserId, invoice_id: invId, amount,
        method: methodEl ? methodEl.value : 'cash', comment: commentEl ? commentEl.value : ''
      })});
      state.payingInvoiceId = null;
      await loadInvoices();
      notify(t('Оплата отмечена'));
      render();
    }catch(err){ notify(t('Не удалось отметить оплату')); }
    return;
  }

  if(el = e.target.closest('[data-apply-promo]')){
    const input = document.getElementById('checkout-promo-input');
    const code = input ? input.value.trim() : '';
    if(!code){ state.promoCode=''; state.promoResult=null; render(); return; }
    try{
      const r = await api('/api/promo/check?code='+encodeURIComponent(code)+'&subtotal='+cartTotalSum());
      state.promoCode = code;
      state.promoResult = r;
      render();
    }catch(err){ notify(t('Не удалось проверить промокод')); }
    return;
  }

  if(el = e.target.closest('[data-icon-upload-cat]')){ state.pendingIconTarget = {type:'category', id:+el.dataset.iconUploadCat}; document.getElementById('icon-file-input').click(); return; }
  if(el = e.target.closest('[data-icon-upload-prod]')){ state.pendingIconTarget = {type:'product', id:+el.dataset.iconUploadProd}; document.getElementById('icon-file-input').click(); return; }

  if(el = e.target.closest('[data-use-template]')){
    const tpls = localGet('templates', []);
    const t = tpls.find(x=>x.id===el.dataset.useTemplate);
    if(t){ t.items.forEach(it=>addToCart(it)); state.tab='cart'; render(); }
    return;
  }
  if(el = e.target.closest('[data-save-template]')){
    const tpls = localGet('templates', []);
    tpls.unshift({id:'t'+Date.now(), title:t('Шаблон от ')+new Date().toLocaleDateString('ru-RU'), items: state.cart.map(i=>Object.assign({},i))});
    localSet('templates', tpls);
    notify(t('Шаблон сохранён')); render();
    return;
  }
});

contentEl.addEventListener('input', (e)=>{
  if(e.target.id==='search-input'){
    state.searchQuery = e.target.value;
    document.getElementById('search-results').innerHTML = searchResultsHTML();
  }
  if(e.target.matches('[data-item-calc]')){
    const iid = e.target.dataset.itemCalc;
    const priceEl = document.getElementById('price-input-'+iid);
    const qtyEl = document.getElementById('delivered-input-'+iid);
    const itogEl = document.getElementById('itog-'+iid);
    if(itogEl){
      const basePrice = parseFloat(itogEl.dataset.price)||0;
      const baseQty = parseFloat(itogEl.dataset.qty)||0;
      const price = priceEl ? (parseFloat(priceEl.value)||0) : basePrice;
      const qty = qtyEl ? (parseFloat(qtyEl.value)||0) : baseQty;
      itogEl.textContent = fmt(price*qty)+t(' сум');
    }
  }
});

contentEl.addEventListener('change', async (e)=>{
  if(e.target.id==='orders-date-input'){
    state.ordersDate = e.target.value || todayStr(); render(); return;
  }
  if(e.target.matches('[data-qty-input]')){
    const p = findProduct(+e.target.dataset.qtyInput);
    if(p) setCartQty(p, parseFloat(e.target.value.replace(',','.'))||0);
    if(state.overlay==='search'){ document.getElementById('search-results').innerHTML = searchResultsHTML(); updateCartBadge(); }
    else render();
    return;
  }
  if(e.target.matches('[data-cart-qty-input]')){
    const name = e.target.dataset.cartQtyInput;
    const it = state.cart.find(c=>c.name===name);
    if(it) setCartQty({name: it.name, unit: it.unit, price: it.price}, parseFloat(e.target.value.replace(',','.'))||0);
    render();
    return;
  }
  if(e.target.matches('[data-admin-scope-select]')){
    state.adminScopeUserId = +e.target.value;
    if(state.overlay==='invoices') await loadInvoices();
    else if(state.overlay==='payments') await loadPayments();
    else if(state.overlay==='monitoring') await loadMonitoring();
    render();
    return;
  }
  if(e.target.matches('[data-order-status-select]')){
    const oid = +e.target.dataset.orderStatusSelect;
    try{
      const o = await api('/api/orders/'+oid+'/status', {method:'PATCH', body: JSON.stringify({status: e.target.value})});
      state.orders = state.orders.map(x=>x.id===o.id?o:x);
      render();
    }catch(err){ notify(t('Ошибка')); }
  }
});

contentEl.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const form = e.target;
  const kind = form.dataset.form;
  const fd = new FormData(form);
  const submitBtn = form.querySelector('button[type="submit"]');
  const submitBtnOrigText = submitBtn ? submitBtn.textContent : '';
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = t('Сохраняем')+'…'; }
  try{
    if(kind==='add-category'){
      const newCat = await api('/api/admin/categories', {method:'POST', body: JSON.stringify({name: fd.get('name')})});
      state.catalog.push(newCat);
      render();
      focusFormField('[data-form="add-category"]', 'name');
    } else if(kind==='add-subcategory'){
      const newCat = await api('/api/admin/categories', {method:'POST', body: JSON.stringify({name: fd.get('name'), parent_id: +form.dataset.cat})});
      const parent = findCategory(+form.dataset.cat);
      if(parent){ (parent.subcategories = parent.subcategories||[]).push(newCat); render(); }
      else { await refreshCatalog(); render(); }
      focusFormField('[data-form="add-subcategory"]', 'name');
    } else if(kind==='add-product'){
      const newProd = await api('/api/admin/products', {method:'POST', body: JSON.stringify({
        category_id: +form.dataset.cat, name: fd.get('name'), unit: fd.get('unit')||t('кг'), price: +fd.get('price')||0,
        old_price: fd.get('old_price') ? +fd.get('old_price') : null
      })});
      const cat = findCategory(+form.dataset.cat);
      if(cat){ (cat.products = cat.products||[]).push(newProd); render(); }
      else { await refreshCatalog(); render(); }
      focusFormField('[data-form="add-product"]', 'name');
    } else if(kind==='edit-product'){
      const id = +form.dataset.id;
      const p = findProduct(id);
      await api('/api/admin/products/'+id, {method:'PATCH', body: JSON.stringify({
        category_id: p.categoryId, name: fd.get('name'), unit: fd.get('unit'), price: +fd.get('price')||0,
        old_price: fd.get('old_price') ? +fd.get('old_price') : null,
        in_stock: fd.get('in_stock')==='on', icon: p.icon||''
      })});
      await refreshCatalog(); render();
      notify(t('Сохранено'));
    } else if(kind==='rename-category'){
      const id = +form.dataset.id;
      await api('/api/admin/categories/'+id, {method:'PATCH', body: JSON.stringify({name: fd.get('name')})});
      state.renamingCatId = null;
      await refreshCatalog(); render();
      notify(t('Название обновлено'));
    } else if(kind==='add-promo'){
      await api('/api/admin/promocodes', {method:'POST', body: JSON.stringify({
        code: fd.get('code'),
        discount_percent: fd.get('discount_percent') ? +fd.get('discount_percent') : null,
        discount_amount: fd.get('discount_amount') ? +fd.get('discount_amount') : null,
        first_order_only: fd.get('first_order_only')==='on',
        max_uses: fd.get('max_uses') ? +fd.get('max_uses') : null
      })});
      state.adminPromoCache = await api('/api/admin/promocodes'); form.reset(); render();
      notify(t('Промокод добавлен'));
    } else if(kind==='edit-promo'){
      const id = +form.dataset.id;
      await api('/api/admin/promocodes/'+id, {method:'PATCH', body: JSON.stringify({
        code: fd.get('code'),
        discount_percent: fd.get('discount_percent') ? +fd.get('discount_percent') : null,
        discount_amount: fd.get('discount_amount') ? +fd.get('discount_amount') : null,
        first_order_only: fd.get('first_order_only')==='on',
        is_active: fd.get('is_active')==='on',
        max_uses: fd.get('max_uses') ? +fd.get('max_uses') : null
      })});
      state.adminPromoCache = await api('/api/admin/promocodes'); render();
      notify(t('Сохранено'));
    } else if(kind==='add-user'){
      await api('/api/admin/users', {method:'POST', body: JSON.stringify({
        telegram_id: fd.get('telegram_id'), name: fd.get('name')||'', restaurant: fd.get('restaurant')||'',
        position: fd.get('position')||'', role: fd.get('role')||'user'
      })});
      adminUsersCache = await api('/api/admin/users'); form.reset(); render();
      notify(t('Доступ выдан'));
    } else if(kind==='edit-user'){
      const id = +form.dataset.id;
      const u = adminUsersCache.find(x=>x.id===id);
      await api('/api/admin/users/'+id, {method:'PATCH', body: JSON.stringify({
        telegram_id: u.telegram_id, name: fd.get('name')||'', restaurant: fd.get('restaurant')||'',
        position: fd.get('position')||'', role: fd.get('role')||'user', is_active: fd.get('is_active')==='on',
        credit_limit: +fd.get('credit_limit')||0, credit_balance: +fd.get('credit_balance')||0
      })});
      adminUsersCache = await api('/api/admin/users'); render();
      notify(t('Сохранено'));
    }
  }catch(err){ notify(t('Не удалось сохранить. Проверьте данные.')); }
  finally{ if(submitBtn && document.body.contains(submitBtn)){ submitBtn.disabled = false; submitBtn.textContent = submitBtnOrigText; } }
});

function fileToResizedDataURL(file, maxSize, quality){
  maxSize = maxSize || 1000; quality = quality || 0.9;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxSize){ h=Math.round(h*maxSize/w); w=maxSize; } }
        else { if(h>maxSize){ w=Math.round(w*maxSize/h); h=maxSize; } }
        const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('icon-file-input').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  const target = state.pendingIconTarget;
  e.target.value = '';
  if(!file || !target) return;
  const triggerBtn = document.querySelector('[data-icon-upload-cat="'+target.id+'"], [data-icon-upload-prod="'+target.id+'"]');
  const triggerOrigHTML = triggerBtn ? triggerBtn.innerHTML : '';
  if(triggerBtn){ triggerBtn.disabled = true; triggerBtn.innerHTML = '<span class="mini-spinner"></span>'; }
  try{
    const dataUrl = await fileToResizedDataURL(file, 1200, 0.85);
    if(target.type==='category'){
      const cat = findCategory(target.id);
      const updated = await api('/api/admin/categories/'+target.id, {method:'PATCH', body: JSON.stringify({name: cat.name, icon: dataUrl})});
      if(cat) cat.icon = updated.icon;
    } else {
      const p = findProduct(target.id);
      const updated = await api('/api/admin/products/'+target.id, {method:'PATCH', body: JSON.stringify({
        category_id: p.categoryId, name: p.name, unit: p.unit, price: p.price, in_stock: p.in_stock, icon: dataUrl
      })});
      const cat = findCategory(p.categoryId);
      const idx = cat ? (cat.products||[]).findIndex(x=>x.id===p.id) : -1;
      if(idx>=0) cat.products[idx] = updated;
    }
    render();
  }catch(err){
    notify(t('Не удалось загрузить фото'));
    if(triggerBtn && document.body.contains(triggerBtn)){ triggerBtn.disabled = false; triggerBtn.innerHTML = triggerOrigHTML; }
  }
});

/* ---------- Свайп влево — назад ---------- */
let touchStartX=null, touchStartY=null;
document.addEventListener('touchstart', e=>{
  if(e.touches.length!==1) return;
  touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', e=>{
  if(touchStartX===null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  touchStartX = null;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5 && dx < 0) goBack();
}, {passive:true});

boot();
</script>
